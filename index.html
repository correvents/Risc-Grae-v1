    async function heliActualitzarBase(idx, valor) {
      if (!valor) return;
      helicopterDadesActuals[idx].base = valor;

      // Geocodificar
      heliEl('status').textContent = '📍 Cercant...';
      const coords = await geocodificar(valor);
      if (coords) {
        helicopterDadesActuals[idx].lat = coords.lat;
        helicopterDadesActuals[idx].lon = coords.lon;
        heliEl('status').textContent = '📍 Trobat';
        actualitzarMarcadors();
      } else {
        heliEl('status').textContent = '⚠️ Lloc no trobat';
      }
      heliAutoSave();
    }

    function heliActualitzarCamp(idx, camp, valor) {
      helicopterDadesActuals[idx][camp] = valor;
      if (camp === 'operativitat') renderTaulaHelicopters();
    }

    function afegirHelicoter() {
      helicopterDadesActuals.push({
        id: 'h' + Date.now(),
        recurs: '', base: '', lat: null, lon: null,
        operativitat: 'Total', observacions: ''
      });
      renderTaulaHelicopters();
      heliAutoSave();
    }

    function eliminarHelicopter(idx) {
      if (helicopterDadesActuals.length <= 1) return;
      helicopterDadesActuals.splice(idx, 1);
      renderTaulaHelicopters();
      heliAutoSave();
    }

    function actualitzarMarcadors() {
      if (!helicopterMap) return;
      Object.values(helicopterMarkers).forEach(m => helicopterMap.removeLayer(m));
      helicopterMarkers = {};

      // Agrupar helicòpters per base (si mateixa base) o per coordenada (~1km)
      const grups = {};
      helicopterDadesActuals.forEach((h, i) => {
        if (!h.lat || !h.lon) return;
        const key = h.base
          ? h.base.toLowerCase().trim()
          : parseFloat(h.lat).toFixed(2) + ',' + parseFloat(h.lon).toFixed(2);
        if (!grups[key]) grups[key] = { lat: parseFloat(h.lat), lon: parseFloat(h.lon), helis: [] };
        grups[key].helis.push({ h, i });
      });

      Object.values(grups).forEach(grup => {
        const { lat, lon, helis } = grup;

        const etiquetes = helis.map(({ h }) => {
          const opBg = h.operativitat === 'Total' ? '#2e7d32' :
                       h.operativitat === 'Parcial' ? '#e65100' :
                       h.operativitat === 'Sense grua' ? '#f9a825' : 'rgba(240,240,240,0.95)';
          const opText = h.operativitat === 'Baixa' ? '#555' : 'white';
          const shadow = opText === 'white' ? '0 1px 2px rgba(0,0,0,0.5)' : 'none';
          return `<div style="background:${opBg};color:${opText};padding:4px 10px;border-radius:12px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,0.35);text-shadow:${shadow};margin-bottom:3px;">&#x1F681; ${h.recurs||'?'}</div>`;
        }).join('');

        const popupHTML = helis.map(({ h }) =>
          `<strong>&#x1F681; ${h.recurs||'?'}</strong> &mdash; ${h.base||''}<br>&#x2699;&#xFE0F; ${h.operativitat||''}${h.observacions ? ' &middot; '+h.observacions : ''}`
        ).join('<hr style="margin:4px 0;">');

        const icon = L.divIcon({
          html: `<div style="display:flex;flex-direction:column;align-items:flex-start;">${etiquetes}</div>`,
          className: '',
          iconAnchor: [0, helis.length * 16]
        });

        const marker = L.marker([lat, lon], { icon, draggable: !heliReadOnly })
          .addTo(helicopterMap)
          .bindPopup(popupHTML);

        if (!heliReadOnly) {
          marker.on('dragend', function(e) {
            const pos = e.target.getLatLng();
            helis.forEach(({ i }) => {
              helicopterDadesActuals[i].lat = parseFloat(pos.lat.toFixed(5));
              helicopterDadesActuals[i].lon = parseFloat(pos.lng.toFixed(5));
            });
            heliAutoSave();
          });
        }

        helis.forEach(({ i }) => { helicopterMarkers[i] = marker; });
      });
    }



    // ==================== ÍNDEXS DISTRIBUCIÓ I OPERATIVITAT ====================
    function provinciaDeBase(base) {
      if (!base) return null;
      const b = base.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      // Girona
      const girona = ["girona","figueres","olot","ripoll","vic","manlleu","banyoles","blanes","lloret","santa coloma de farners","la bisbal","palafrugell","palamos","roses","escala","la jonquera","puigcerda","cerdanya","camprodon","sant feliu"];
      if (girona.some(x => b.includes(x))) return "Girona";
      // Tarragona
      const tarragona = ["tarragona","reus","tortosa","valls","el vendrell","amposta","ametlla","calafell","cambrils","salou","mont-roig","gandesa","mora","deltebre","rapita","ebre"];
      if (tarragona.some(x => b.includes(x))) return "Tarragona";
      // Lleida
      const lleida = ["lleida","balaguer","cervera","igualada","solsona","tremp","sort","vielha","seu d urgell","la seu","ponts","mollerussa","tarrega","artesa","pobla de segur","pont de suert"];
      if (lleida.some(x => b.includes(x))) return "Lleida";
      // Barcelona
      const barcelona = ["barcelona","sabadell","terrassa","badalona","hospitalet","mataro","granollers","mollet","montcada","rubi","sant cugat","vilafranca","vilanova","berga","cardona","torello","puig-reig","navarcles","manresa","sant joan","martorell","abrera","esparreguera"];
      if (barcelona.some(x => b.includes(x))) return "Barcelona";
      return null; // no identificat
    }

    function provinciaDeCoords(lat, lon) {
      // Fallback per coordenades quan no es pot determinar per nom
      if (lat >= 41.7 && lon >= 2.3) return 'Girona';
      if (lat < 41.35) return 'Tarragona';
      if (lat < 41.5 && lon >= 0.8 && lon < 2.3) return 'Tarragona';
      if (lon < 1.3) return 'Lleida';
      if (lon < 1.85 && lat >= 41.5) return 'Lleida';
      return 'Barcelona';
    }

    function calcularIndexos() {
      const helis = helicopterDadesActuals.filter(h => h.lat && h.lon);

      // Distribució: quantes províncies diferents tenen almenys 1 HC operatiu (no Baixa)
      const provinciesAmbHeli = new Set();
      const debugHelis = [];
      helis.forEach(h => {
        const op = (h.operativitat || '').trim();
        const prov = provinciaDeBase(h.base) || provinciaDeCoords(parseFloat(h.lat), parseFloat(h.lon));
        debugHelis.push({ recurs: h.recurs, base: h.base, lat: h.lat, lon: h.lon, op, prov });
        if (op !== 'Baixa') {
          provinciesAmbHeli.add(prov);
        }
      });
      const distribucio = provinciesAmbHeli.size;

      // Operativitat: Total=1, Parcial/Sense grua=0.5, Baixa=0
      let opTotal = 0;
      helis.forEach(h => {
        const op = (h.operativitat || '').trim();
        if (op === 'Total') opTotal += 1;
        else if (op !== 'Baixa') opTotal += 0.5;
      });
      const operativitat = Math.min(4, opTotal);

      return { distribucio, operativitat, provinciesAmbHeli: [...provinciesAmbHeli], debugHelis };
    }

    function renderIndexos() {
      const cont = heliEl('indexos');
      if (!cont) return;
      const idx = calcularIndexos();
      const { distribucio, operativitat, provinciesAmbHeli } = idx;

      const colorIdx = (val) => val >= 3.5 ? '#2e7d32' : val >= 2.5 ? '#f57f17' : val >= 1 ? '#e65100' : '#c62828';
      const colorDist = colorIdx(distribucio);
      const colorOp = colorIdx(operativitat);

      const totesProv = ['Barcelona','Girona','Lleida','Tarragona'];
      const provHTML = totesProv.map(p => {
        const activa = provinciesAmbHeli.includes(p);
        return `<span style="font-size:0.72rem;padding:0.15rem 0.4rem;border-radius:3px;background:${activa?'#e8f5e9':'#f5f5f5'};color:${activa?'#2e7d32':'#bbb'};font-weight:${activa?'700':'400'};">${p}</span>`;
      }).join('');

      cont.innerHTML = `
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:stretch;">
          <div style="flex:1;min-width:160px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:0.6rem 0.9rem;border-left:4px solid ${colorDist};">
            <div style="font-size:0.7rem;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:0.3rem;">Distribució territorial</div>
            <div style="display:flex;align-items:baseline;gap:0.4rem;">
              <span style="font-size:2rem;font-weight:800;color:${colorDist};line-height:1;">${distribucio}</span>
              <span style="font-size:0.8rem;color:#aaa;">/4</span>
            </div>
            <div style="display:flex;gap:0.3rem;flex-wrap:wrap;margin-top:0.4rem;">${provHTML}</div>
          </div>
          <div style="flex:1;min-width:160px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:0.6rem 0.9rem;border-left:4px solid ${colorOp};">
            <div style="font-size:0.7rem;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:0.3rem;">Operativitat</div>
            <div style="display:flex;align-items:baseline;gap:0.4rem;">
              <span style="font-size:2rem;font-weight:800;color:${colorOp};line-height:1;">${operativitat % 1 === 0 ? operativitat : operativitat.toFixed(1)}</span>
              <span style="font-size:0.8rem;color:#aaa;">/4</span>
            </div>
            <div style="font-size:0.72rem;color:#888;margin-top:0.3rem;">Total=1pt · Parcial/Sense grua=0.5pt · Baixa=0pt</div>
          </div>
        </div>
        <details style="margin-top:0.4rem;font-size:0.72rem;color:#aaa;padding:0 1rem 0.5rem;">
          <summary style="cursor:pointer;">🔍 Debug distribució</summary>
          <div id="heli-debug-idx"></div>
        </details>`;
    }

    // ==================== OPEN-METEO PER HELICÒPTERS ====================
    // Codis WMO rellevants per vol
    function wmoDescripcio(code) {
      if (code === 0) return 'Cel clar';
      if (code <= 3) return 'Ennuvolat';
      if (code <= 9) return 'Boira/neblina';
      if (code === 45 || code === 48) return '🌫️ Boira';
      if (code <= 49) return 'Boira';
      if (code <= 59) return '🌦️ Plugim';
      if (code <= 69) return '🌧️ Pluja';
      if (code <= 79) return '❄️ Neu';
      if (code <= 82) return '🌧️ Ruixats';
      if (code <= 86) return '❄️ Ruixats neu';
      if (code <= 99) return '⛈️ Tempesta';
      return 'Desconegut';
    }

    function volSemafor(visibilitat, nuvolsBaixos, ventRatxa, wmo) {
      // Criteris simplificats per vol VFR helicòpter rescat
      const boira = (wmo === 45 || wmo === 48 || (wmo >= 10 && wmo <= 12));
      const visKm = visibilitat / 1000;

      if (boira || visKm < 1.5) return { color: '#c62828', text: '🔴 No recomanat', detall: 'Visibilitat crítica' };
      if (visKm < 3 || nuvolsBaixos > 75) return { color: '#e65100', text: '🟠 Condicionat', detall: 'Visibilitat/núvols limitants' };
      if (ventRatxa > 60 || nuvolsBaixos > 50) return { color: '#f57f17', text: '🟡 Precaució', detall: 'Vent fort o núvols baixos' };
      return { color: '#2e7d32', text: '🟢 Favorable', detall: 'Condicions acceptables' };
    }

    async function carregarMeteoHelicopters() {
      const helis = helicopterDadesActuals.filter(h => h.lat && h.lon);
      if (helis.length === 0) return;

      const cont = heliEl('meteo-cont');
      if (!cont) return;
      cont.innerHTML = '<div style="color:#aaa;font-size:0.8rem;padding:0.5rem;">Carregant dades meteorològiques...</div>';

      const ara = new Date();
      const horaActual = ara.getHours();
      const avuiStr = ara.toISOString().substring(0,10);
      const dema = new Date(ara); dema.setDate(dema.getDate()+1);
      const demaStr = dema.toISOString().substring(0,10);

      // Orto, ocàs i crepuscle (usem la primera base disponible)
      try {
        const h0 = helis[0];
        const urlSol = 'https://api.open-meteo.com/v1/forecast?' +
          'latitude=' + h0.lat + '&longitude=' + h0.lon +
          '&daily=sunrise,sunset&forecast_days=2&timezone=Europe%2FMadrid';
        const rSol = await fetch(urlSol);
        const dSol = await rSol.json();
        const contSol = heliEl('sol-cont');
        if (contSol && dSol.daily) {
          const dies = ['Avui', 'Demà'];
          contSol.innerHTML = dSol.daily.time.map((data, i) => {
            const sunrise = dSol.daily.sunrise[i].substring(11,16);
            const sunset  = dSol.daily.sunset[i].substring(11,16);
            // Crepuscle civil ~30min abans/després
            const addMin = (hhmm, mins) => {
              const [h, m] = hhmm.split(':').map(Number);
              const total = h*60 + m + mins;
              return String(Math.floor(((total%1440)+1440)%1440/60)).padStart(2,'0') + ':' + String(((total%1440)+1440)%60).padStart(2,'0');
            };
            const crepMati = addMin(sunrise, -30);
            const crepVesp = addMin(sunset, 30);
            return `<div style="flex:1;min-width:160px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:0.6rem 0.9rem;">
              <div style="font-size:0.72rem;font-weight:700;color:#888;margin-bottom:0.4rem;text-transform:uppercase;">${dies[i]} · ${data}</div>
              <div style="display:flex;gap:0.75rem;flex-wrap:wrap;font-size:0.82rem;">
                <div title="Crepuscle matutí">🌅 <strong>${crepMati}</strong> <span style="color:#aaa;font-size:0.7rem;">crep.</span></div>
                <div title="Orto">☀️ <strong>${sunrise}</strong> <span style="color:#aaa;font-size:0.7rem;">orto</span></div>
                <div title="Ocàs">🌇 <strong>${sunset}</strong> <span style="color:#aaa;font-size:0.7rem;">ocàs</span></div>
                <div title="Crepuscle vespertí">🌆 <strong>${crepVesp}</strong> <span style="color:#aaa;font-size:0.7rem;">crep.</span></div>
              </div>
            </div>`;
          }).join('');
        }
      } catch(e) { logError('Helicòpters', e.message); }

      // Agrupar per coordenades
      const coordsVistes = new Set();
      const resultats = [];

      for (const h of helis) {
        const key = parseFloat(h.lat).toFixed(2) + ',' + parseFloat(h.lon).toFixed(2);
        if (coordsVistes.has(key)) continue;
        coordsVistes.add(key);

        try {
          const url = 'https://api.open-meteo.com/v1/forecast?' +
            'latitude=' + h.lat + '&longitude=' + h.lon +
            '&hourly=visibility,cloud_cover_low,wind_speed_10m,wind_gusts_10m,weather_code' +
            '&forecast_days=2&timezone=Europe%2FMadrid&wind_speed_unit=kmh';

          const resp = await fetch(url);
          const data = await resp.json();
          const times = data.hourly.time;

          // Hora actual
          const idxAra = horaActual;

          // Hores d'avui restants (cada 2h)
          const horesAvui = [];
          for (let h2 = horaActual; h2 <= 23; h2 += 2) {
            const idx = times.findIndex(t => t === avuiStr + 'T' + String(h2).padStart(2,'0') + ':00');
            if (idx >= 0) horesAvui.push({ hora: String(h2).padStart(2,'0')+'h', idx });
          }

          // Hores de demà (cada 3h: 6, 9, 12, 15, 18)
          const horesDema = [6,9,12,15,18].map(h2 => {
            const idx = times.findIndex(t => t === demaStr + 'T' + String(h2).padStart(2,'0') + ':00');
            return idx >= 0 ? { hora: String(h2).padStart(2,'0')+'h', idx } : null;
          }).filter(Boolean);

          const get = (arr, idx, key) => arr[key] ? arr[key][idx] : null;
          const d = data.hourly;

          resultats.push({
            h, key,
            ara: { vis: d.visibility[idxAra], nuv: d.cloud_cover_low[idxAra], vent: d.wind_speed_10m[idxAra], ratxa: d.wind_gusts_10m[idxAra], wmo: d.weather_code[idxAra] },
            horesAvui: horesAvui.map(({hora,idx}) => ({ hora, vis: d.visibility[idx], nuv: d.cloud_cover_low[idx], ratxa: d.wind_gusts_10m[idx], wmo: d.weather_code[idx] })),
            horesDema: horesDema.map(({hora,idx}) => ({ hora, vis: d.visibility[idx], nuv: d.cloud_cover_low[idx], ratxa: d.wind_gusts_10m[idx], wmo: d.weather_code[idx] }))
          });
        } catch(e) {
          resultats.push({ h, error: true, key });
        }
      }

      function renderHores(hores) {
        return hores.map(p => {
          const s = volSemafor(p.vis, p.nuv, p.ratxa, p.wmo);
          const ico = p.wmo===0?'☀️':p.wmo<=3?'⛅':p.wmo<=12?'🌫️':p.wmo<=67?'🌧️':p.wmo<=77?'❄️':'⛈️';
          return `<div style="text-align:center;min-width:40px;">
            <div style="font-size:0.65rem;color:#888;">${p.hora}</div>
            <div style="font-size:0.9rem;">${ico}</div>
            <div style="font-size:0.65rem;color:${s.color};font-weight:700;">${(p.vis/1000).toFixed(1)}km</div>
          </div>`;
        }).join('');
      }

      function renderTargeta(r, diaLabel, hores, destacat) {
        const sem = volSemafor(r.vis, r.nuv, r.ratxa, r.wmo);
        const visKm = (r.vis/1000).toFixed(1);
        const border = destacat ? `border:2px solid ${sem.color}` : `border:1px solid #e0e0e0`;
        return `<div style="background:#fff;${border};border-radius:8px;padding:0.6rem 0.9rem;border-left:4px solid ${sem.color};">
          <div style="font-size:0.72rem;font-weight:700;color:#888;margin-bottom:0.3rem;text-transform:uppercase;">${diaLabel}</div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.4rem;">
            <div>
              <div style="font-size:0.95rem;font-weight:700;color:${sem.color};">${sem.text}</div>
              <div style="font-size:0.72rem;color:#888;">${sem.detall}</div>
            </div>
            <div style="font-size:0.78rem;color:#555;text-align:right;">
              <div>👁️ <strong>${visKm}km</strong> · ☁️ <strong>${r.nuv}%</strong></div>
              <div>💨 <strong>${Math.round(r.vent)} km/h</strong> · ↑ <strong>${Math.round(r.ratxa)}</strong></div>
            </div>
          </div>
          <div style="display:flex;gap:0.2rem;margin-top:0.4rem;padding-top:0.4rem;border-top:1px solid #f0f0f0;flex-wrap:wrap;">
            ${renderHores(hores)}
          </div>
        </div>`;
      }

      // Pitjor cas de demà (hora 9-18)
      function pitjorDema(hores) {
        if (!hores.length) return null;
        return hores.reduce((worst, h2) => {
          const s = volSemafor(h2.vis, h2.nuv, h2.ratxa, h2.wmo);
          const sw = volSemafor(worst.vis, worst.nuv, worst.ratxa, worst.wmo);
          const ord = {'🟢 Favorable':0,'🟡 Precaució':1,'🟠 Condicionat':2,'🔴 No recomanat':3};
          return (ord[s.text]||0) > (ord[sw.text]||0) ? h2 : worst;
        });
      }

      cont.innerHTML = resultats.map(r => {
        if (r.error) return `<div style="padding:0.5rem;color:#e53935;font-size:0.8rem;">⚠️ Error ${r.h.base||r.h.recurs}</div>`;

        const helisBase = helicopterDadesActuals.filter(hh => hh.lat && hh.lon &&
          parseFloat(hh.lat).toFixed(2) === parseFloat(r.h.lat).toFixed(2) &&
          parseFloat(hh.lon).toFixed(2) === parseFloat(r.h.lon).toFixed(2)
        ).map(hh => hh.recurs).join(', ');

        const demaResumData = pitjorDema(r.horesDema) || r.horesDema[0];

        return `<div style="background:#f9f9f9;border:1px solid #ddd;border-radius:8px;padding:0.75rem;margin-bottom:0.75rem;">
          <div style="font-weight:700;font-size:0.9rem;margin-bottom:0.6rem;">🚁 ${helisBase} — ${r.h.base||'?'}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;">
            ${renderTargeta(r.ara, '📅 Avui', r.horesAvui, true)}
            ${demaResumData ? renderTargeta(demaResumData, '📅 Demà', r.horesDema, false) : '<div style="color:#aaa;font-size:0.8rem;">Sense dades demà</div>'}
          </div>
        </div>`;
      }).join('');
    }

    async function canviarDataHelicopters(dataStr) {
      helicopterDataActual = dataStr;
      await carregarDadesHelicoptersDia(dataStr);
    }

    let heliAutoSaveTimer = null;
    function heliAutoSave() {
      clearTimeout(heliAutoSaveTimer);
      const s = heliEl('status'); if (s) s.textContent = '...';

    async function guardarHelicoptersSupabase(dataStr, helis) {
      const rows = helis.map(h => ({
        data: dataStr,
        heli_id: h.id,

        base: h.base,

      }));

    // ==================== CANVI DE TEMPS ====================

    const CANVI_PUNTS = [
      { nom: 'Boí Taüll',     lat: 42.490, lon: 0.837, alt: 2500 },
      { nom: 'Tavascan',      lat: 42.658, lon: 1.215, alt: 1800 },
      { nom: 'Port Bonaigua', lat: 42.534, lon: 1.014, alt: 2072 },
      { nom: 'Espot Esquí',   lat: 42.570, lon: 1.090, alt: 2200 },
      { nom: 'La Molina',     lat: 42.337, lon: 1.942, alt: 2050 },
      { nom: 'Vall de Núria', lat: 42.394, lon: 2.148, alt: 1967 },
      { nom: 'Vallter 2000',  lat: 42.393, lon: 2.345, alt: 2000 }
    ];

    function esTemporadaCanvi() {
      const avui = new Date();
      const mes = avui.getMonth() + 1;
      const dia = avui.getDate();
      if (mes === 8 && dia >= 20) return true;
      if (mes === 9 || mes === 10) return true;
      return false;
    }

    function esVentPerillos(graus) {
      const d = ((graus % 360) + 360) % 360;
      return d >= 292.5 || d <= 67.5; // N, NE, NW
    }

    function wmoTextCanvi(code) {
      if (code >= 96) return 'Tempesta amb pedregada';
      if (code >= 95) return 'Tempesta';
      if (code >= 85) return 'Ruixats de neu';
      if (code >= 80) return 'Ruixats de pluja';
      if (code >= 77) return 'Granins de neu';
      if (code >= 75) return 'Neu intensa';
      if (code >= 71) return 'Neu';
      if (code >= 67) return 'Pluja i neu barrejades';
      if (code >= 61) return 'Pluja';
      if (code >= 57) return 'Plugim i geladet';
      if (code >= 51) return 'Plugim';
      if (code >= 45) return 'Boira';
      if (code >= 40) return 'Boira lleugera';
      if (code === 3)  return 'Cel cobert';
      if (code === 2)  return 'Parcialment ennuvolat';
      if (code === 1)  return 'Poc ennuvolat';
      if (code === 0)  return 'Cel clar';
      return `WMO ${code}`;
    }

    function calcularRiscDia(prev, dataStr, avg30d, punt) {
      const idx = (hIni, hFi) => prev.hourly.time.reduce((acc, t, i) => {
        const [d, h] = t.split('T'); const hr = parseInt(h);
        if (d === dataStr && hr >= hIni && hr < hFi) acc.push(i);
        return acc;
      }, []);
      const idxMati  = idx(6, 12);
      const idxTarda = idx(12, 19);
      if (!idxTarda.length) return { nivell: 0, factors: [], dades: null };

      const gM = arr => idxMati.map(i => arr[i]);
      const gT = arr => idxTarda.map(i => arr[i]);

      const tempsMati = gM(prev.hourly.temperature_2m);
      const precMati  = gM(prev.hourly.precipitation).reduce((a,b)=>a+b,0);
      const ventVMati = gM(prev.hourly.windspeed_10m);
      const wmoMati   = idxMati.length ? Math.max(...gM(prev.hourly.weathercode)) : 0;
      const tmaxMati  = tempsMati.length ? Math.max(...tempsMati) : null;
      const ventMaxMati = ventVMati.length ? Math.max(...ventVMati) : 0;

      const tempsTarda = gT(prev.hourly.temperature_2m);
      const precTarda  = gT(prev.hourly.precipitation).reduce((a,b)=>a+b,0);
      const neuTarda   = gT(prev.hourly.snowfall).reduce((a,b)=>a+b,0);
      const ventVTarda = gT(prev.hourly.windspeed_10m);
      const ventDTarda = gT(prev.hourly.winddirection_10m);
      const wmoTarda   = Math.max(...gT(prev.hourly.weathercode));
      const tminTarda  = tempsTarda.length ? Math.min(...tempsTarda) : null;
      const tmaxTarda  = tempsTarda.length ? Math.max(...tempsTarda) : null;
      const ventMaxTarda = ventVTarda.length ? Math.max(...ventVTarda) : 0;
      const ventMaxDirTarda = ventDTarda[ventVTarda.indexOf(ventMaxTarda)] ?? 0;

      let nivellBase = 0;
      const factors = [];

      if (tmaxMati !== null && tminTarda !== null) {
        const drop = tmaxMati - tminTarda;
        if (drop >= 10)     { nivellBase = Math.max(nivellBase, 2); factors.push(`🌡️ Descens ${drop.toFixed(0)}°C (${tmaxMati.toFixed(0)}→${tminTarda.toFixed(0)}°C)`); }
        else if (drop >= 5) { nivellBase = Math.max(nivellBase, 1); factors.push(`🌡️ Descens ${drop.toFixed(0)}°C (${tmaxMati.toFixed(0)}→${tminTarda.toFixed(0)}°C)`); }
      }
      if (avg30d !== null && tmaxTarda !== null && (avg30d - tmaxTarda) >= 10) {
        nivellBase = Math.max(nivellBase, 1);
        factors.push(`🌡️ Tarda ${tmaxTarda.toFixed(1)}°C (−${(avg30d - tmaxTarda).toFixed(0)}°C vs 30d)`);
      }
      if (neuTarda > 0.1) {
        const nv = punt.alt >= 2400 ? 1 : 2;
        nivellBase = Math.max(nivellBase, nv);
        factors.push(`❄️ Neu a la tarda a ${punt.alt}m${precMati < 1 ? ' (matí sec)' : ''}`);
      }
      if (precTarda >= 10)     { nivellBase = Math.max(nivellBase, 2); factors.push(`🌧️ Pluja ${precTarda.toFixed(1)}mm a la tarda${precMati < 1 ? ' (matí sec)' : ''}`); }
      else if (precTarda >= 5) { nivellBase = Math.max(nivellBase, 1); factors.push(`🌦️ Pluja ${precTarda.toFixed(1)}mm a la tarda${precMati < 1 ? ' (matí sec)' : ''}`); }
      if (wmoTarda >= 95) {
        nivellBase = Math.max(nivellBase, 2);
        factors.push(`⛈️ ${wmoTextCanvi(wmoTarda)} a la tarda${wmoMati < 50 ? ' (matí clar)' : ''}`);
      }
      let bonusVent = 0;
      if (esVentPerillos(ventMaxDirTarda)) {
        const calm = ventMaxMati < 20;
        if (ventMaxTarda >= 60)      { bonusVent = 2; factors.push(`💨 Vent N/NE/NW ${ventMaxTarda.toFixed(0)} km/h tarda${calm?' (matí calm)':''}`); }
        else if (ventMaxTarda >= 40) { bonusVent = 1; factors.push(`💨 Vent N/NE/NW ${ventMaxTarda.toFixed(0)} km/h tarda${calm?' (matí calm)':''}`); }
      }

      return { nivell: Math.min(2, nivellBase + bonusVent), factors, dades: { tmaxMati, precMati, ventMaxMati, wmoMati, tminTarda, tmaxTarda, precTarda, neuTarda, ventMaxTarda, ventMaxDirTarda, wmoTarda, avg30d } };
    }

    async function fetchCanviPunt(punt, avuiStr, demaStr, fa30Str) {
      const p = `latitude=${punt.lat}&longitude=${punt.lon}&elevation=${punt.alt}&timezone=Europe%2FMadrid`;
      const [prevResp, histResp] = await Promise.all([
        fetchAmbTimeout(`https://api.open-meteo.com/v1/forecast?${p}&hourly=temperature_2m,precipitation,snowfall,windspeed_10m,winddirection_10m,weathercode&forecast_days=2`, 15000),
        fetchAmbTimeout(`https://archive-api.open-meteo.com/v1/archive?${p}&daily=temperature_2m_max&start_date=${fa30Str}&end_date=${avuiStr}`, 15000)
      ]);
      if (!prevResp.ok || !histResp.ok) throw new Error(`Error API ${punt.nom}`);
      const prev = await prevResp.json();
      const hist = await histResp.json();
      const histMaxs = (hist.daily?.temperature_2m_max || []).filter(v => v !== null);
      const avg30d = histMaxs.length ? histMaxs.reduce((a,b)=>a+b,0)/histMaxs.length : null;
      return {
        punt,
        avui: calcularRiscDia(prev, avuiStr, avg30d, punt),
        dema: calcularRiscDia(prev, demaStr, avg30d, punt)
      };
    }

    function dirVentText(graus) {
      const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
      return dirs[Math.round(graus / 22.5) % 16];
    }

      let html = `<div style="padding:0.5rem 0.75rem 0.5rem 1.8rem;border-top:1px solid #e8e8e8;">
        <table style="width:100%;border-collapse:collapse;font-size:0.76rem;">

              <th style="text-align:left;padding:0.2rem 0.5rem;color:#888;font-weight:500;width:28%;"></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td style="padding:0.2rem 0.5rem;color:#555;">🌡️ Temperatura</td>
              <td ${tdS}${celBl}">${tmaxMati !== null ? tmaxMati.toFixed(1)+'°C' : '—'}</td>
              <td ${tdS}${celTa}">${tag(dropActiu2||dropActiu1, tminTarda !== null ? tminTarda.toFixed(1)+'°C' : '—')}</td>
              <td style="padding:0.2rem 0.5rem;font-size:0.73rem;">
                ${drop !== null ? tag(dropActiu2||dropActiu1, `Descens ${drop.toFixed(0)}°C`) : ''}
                ${dropActiu2 ? nota('✓ n2') : dropActiu1 ? nota('✓ n1') : drop !== null && drop > 0 ? nota('(cal ≥5°C)') : ''}
                ${anomActiu ? tag(true, `Avg30d: ${avg30d.toFixed(1)}°C`)+nota('✓ n1') : ''}
              </td>
            </tr>
            <tr style="background:#fafafa;">
              <td style="padding:0.2rem 0.5rem;color:#555;">🌧️ Precipitació</td>
              <td ${tdS}${celBl}">${precMati.toFixed(1)} mm</td>
              <td ${tdS}${celTa}">${tag(precActiu2||precActiu1, precTarda.toFixed(1)+' mm')}</td>
              <td style="padding:0.2rem 0.5rem;font-size:0.73rem;">
                ${precActiu2 ? tag(true,'≥10mm')+nota('✓ n2') : precActiu1 ? tag(true,'≥5mm')+nota('✓ n1') : nota('cal ≥5mm')}
              </td>
            </tr>
            <tr>
              <td style="padding:0.2rem 0.5rem;color:#555;">❄️ Neu</td>
              <td ${tdS}${celBl}">—</td>
              <td ${tdS}${celTa}">${tag(neuActiu, neuActiu ? neuTarda.toFixed(1)+' cm' : '0 cm')}</td>
              <td style="padding:0.2rem 0.5rem;font-size:0.73rem;">
                ${neuActiu ? tag(true, `cota ≤${r.punt.alt}m`)+nota(r.punt.alt>=2400?'✓ n1':'✓ n2') : nota('no hi ha neu')}
              </td>
            </tr>
            <tr style="background:#fafafa;">
              <td style="padding:0.2rem 0.5rem;color:#555;">💨 Vent màxim</td>
              <td ${tdS}${celBl}">${ventMaxMati.toFixed(0)} km/h</td>
              <td ${tdS}${celTa}">${tag(ventActiu2||ventActiu1, ventMaxTarda.toFixed(0)+' km/h '+dirVentText(ventMaxDirTarda))}</td>
              <td style="padding:0.2rem 0.5rem;font-size:0.73rem;">
                ${ventActiu2 ? tag(true,'≥60 N/NE/NW')+nota('✓ +2') : ventActiu1 ? tag(true,'≥40 N/NE/NW')+nota('✓ +1') : esNord ? nota('N/NE/NW, cal ≥40') : nota('no és del nord')}
              </td>
            </tr>
            <tr>
              <td style="padding:0.2rem 0.5rem;color:#555;">⛈️ Condicions</td>
              <td ${tdS}${celBl}">${wmoTextCanvi(wmoMati)||'—'}</td>
              <td ${tdS}${celTa}">${tag(wmoActiu, wmoTextCanvi(wmoTarda)||'—')}</td>
              <td style="padding:0.2rem 0.5rem;font-size:0.73rem;">
                ${wmoActiu ? tag(true,'Tempesta/pedregada')+nota('✓ n2') : nota((wmoTextCanvi(wmoTarda)||'—')+' · no hi ha tempesta prevista')}
              </td>
            </tr>
          </tbody>
        </table>
      </div>`;
      return html;
    }

    async function carregarCanviTemps() {
      const cont = document.getElementById('app-canvitemps');
      cont.innerHTML = '<div class="loading"><div class="loading-icon">🌦️</div><p style="margin-top:1rem;opacity:0.8;">Carregant dades meteorològiques...</p></div>';

      try {
        const avui = new Date();
        const dema = new Date(avui); dema.setDate(dema.getDate() + 1);
        const avuiStr = avui.toISOString().split('T')[0];
        const demaStr = dema.toISOString().split('T')[0];
        const fa30 = new Date(avui); fa30.setDate(fa30.getDate() - 31);
        const fa30Str = fa30.toISOString().split('T')[0];

        const resultats = await Promise.all(
          CANVI_PUNTS.map(p => fetchCanviPunt(p, avuiStr, demaStr, fa30Str)
            .catch(e => {
              logError('CanviTemps', e.message, p.nom);
              const err = { nivell: 0, factors: [`⚠️ Error: ${e.message}`], dades: null };
              return { punt: p, avui: err, dema: err };
            }))
        );

        const formatDia = d => d.toLocaleDateString('ca-ES', { weekday: 'long', day: 'numeric', month: 'long' });

        function renderSeccio(dia, diaStr, resultats, camp) {
          const dies = resultats.map(r => ({ punt: r.punt, ...r[camp] }));
          const maxN = Math.max(...dies.map(d => d.nivell));
          const col = ['#388e3c','#e65100','#c62828'][maxN];
          const txt = ['NO ES PREVEU CANVI','NIVELL 1 — MODERAT','NIVELL 2 — ALT'][maxN];
          const ico = ['✅','⚠️','🔴'][maxN];

          let h = `<div style="border-bottom:1px solid #e0e0e0;padding:0.7rem 0.9rem;">
            <div style="font-size:0.7rem;color:#888;margin-bottom:0.3rem;">📅 ${formatDia(dia)}</div>
            <div style="background:${col};color:#fff;border-radius:7px;padding:0.35rem 0.9rem;font-size:0.88rem;font-weight:800;display:inline-block;">${ico} ${txt}</div>
          </div>
          <div style="padding:0.5rem 0.6rem;display:flex;flex-direction:column;gap:0.35rem;">`;

          for (const r of dies) {
            const bg  = ['#f1f8e9','#fff8e1','#ffebee'][r.nivell];
            const brd = ['#c5e1a5','#ffe082','#ef9a9a'][r.nivell];
            const em  = ['🟢','🟠','🔴'][r.nivell];
            const nt  = ['Cap canvi','Moderat','Alt'][r.nivell];
            const resum = r.factors.length ? r.factors.join(' · ') : '';
            h += `<details style="background:${bg};border:1px solid ${brd};border-radius:6px;">
              <summary style="padding:0.45rem 0.7rem;display:flex;align-items:center;gap:0.5rem;cursor:pointer;list-style:none;user-select:none;">
                <span>${em}</span>
                <span style="font-weight:700;font-size:0.84rem;flex:1;">${r.punt.nom} <span style="font-weight:400;color:#888;font-size:0.75rem;">· ${r.punt.alt}m</span></span>
                <span style="font-size:0.72rem;color:#555;">${nt}</span>
              </summary>
              <div style="padding:0 0.7rem 0.1rem;">
                ${resum ? `<div style="font-size:0.76rem;color:#555;margin-bottom:0.15rem;">${resum}</div>` : ''}
                ${renderExplicacioCanvi(r)}
              </div>
            </details>`;
          }
          h += `</div>`;
          return h;
        }

        const horaAct = avui.toLocaleTimeString('ca-ES', { hour: '2-digit', minute: '2-digit' });
        let html = `<div style="font-size:0.7rem;color:#aaa;padding:0.35rem 1rem;background:#fafafa;border-bottom:1px solid #eee;">
          🌦️ Canvi de Temps · Font: Open-Meteo · ${horaAct} · Risc més elevat: 20 ago – 31 oct
        </div>
        <div style="display:flex;flex-wrap:wrap;align-items:flex-start;">
          <div style="flex:1;min-width:280px;border-right:1px solid #e0e0e0;">${renderSeccio(avui, avuiStr, resultats, 'avui')}</div>
          <div style="flex:1;min-width:280px;">${renderSeccio(dema, demaStr, resultats, 'dema')}</div>
        </div>`;
        html += `<div style="padding:0.5rem 1rem;border-top:1px solid #eee;"><button class="risc-btn" style="font-size:0.78rem;" onclick="carregarCanviTemps()">🔄 Actualitzar</button></div>`;

        cont.innerHTML = html;

      } catch(e) {
        logError('CanviTemps', e.message);
        cont.innerHTML = `<div class="error"><div style="font-size:3rem;">⚠️</div><h2>Error carregant dades</h2><p style="opacity:0.8;">${e.message}</p><button onclick="carregarCanviTemps()">Tornar a provar</button></div>`;
      }
    }

    // ==================== PLANS PC ====================
    const FASE_CONFIG = {
      'EMERGÈNCIA': { color: '#ffebee', border: '#e53935', text: '#c62828', emoji: '🔴' },
      'ALERTA':     { color: '#fff3e0', border: '#f57c00', text: '#e65100', emoji: '🟠' },
      'PREALERTA':  { color: '#fffde7', border: '#fbc02d', text: '#f57f17', emoji: '🟡' }
    };

    const carregarPlansPC = async () => {
      const cont = document.getElementById('app-planspc');
      cont.innerHTML = `<div class="loading"><div class="loading-icon">🚨</div><p style="margin-top:1rem;opacity:0.8;">Carregant plans de protecció civil...</p></div>`;
      try {
        const resp = await fetchAmbTimeout(URLS.planspc);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        if (!data.actualitzat) {
          cont.innerHTML = `<div class="error"><div style="font-size:3rem;">🕐</div><h2>Dades no disponibles</h2><p style="opacity:0.8;">Els plans s'actualitzaran demà a les 06:45h.</p><button onclick="carregarPlansPC()">Tornar a provar</button></div>`;
          return;
        }
        dadesCarregades.planspc = data;
        actualitzarRiscAuto();
        renderPlansPC(data);
      } catch (e) {
        cont.innerHTML = `
          <div class="error">
            <div style="font-size:2rem">⚠️</div>
            <h2>Error en carregar</h2>
            <p style="color:#666;font-size:0.9rem">${e.message}</p>
            <button onclick="carregarPlansPC()">Tornar a provar</button>
          </div>`;
      }
    };

    const renderPlansPC = (data) => {
      const cont = document.getElementById('app-planspc');
      const plans = data.plans || [];
      const actualitzat = data.actualitzat ? new Date(data.actualitzat).toLocaleString('ca-ES') : '—';

      // Actualitzar badge
      const badge = document.getElementById('badge-planspc');
      const emergencies = plans.filter(p => p.plafase === 'EMERGÈNCIA').length;
      const alertes = plans.filter(p => p.plafase === 'ALERTA').length;
      if (emergencies > 0) {
        badge.textContent = emergencies;
        badge.style.display = 'inline';
        badge.style.background = '#e53935';
      } else if (alertes > 0) {
        badge.textContent = alertes;
        badge.style.display = 'inline';
        badge.style.background = '#f57c00';
      } else {
        badge.style.display = 'none';
      }

      if (plans.length === 0) {
        cont.innerHTML = `
          <div style="text-align:center;padding:1rem 0 0.5rem;">
            <span style="font-size:0.75rem;color:#999;">Dades del JSON: ${actualitzat}</span>
            <button class="btn-refresh" onclick="carregarPlansPC()" style="margin-left:0.75rem;">🔄 Actualitza plans PC</button>
          </div>
          <div class="no-alertes" style="margin-top:0.75rem;">
            <div class="icon">✅</div>
            <h3>Cap pla de protecció civil activat</h3>
            <p style="color:#555;font-size:0.9rem;margin-top:0.5rem;">No hi ha cap pla en fase de prealerta, alerta o emergència en aquest moment.</p>
          </div>`;
        return;
      }

      // Agrupar per pla
      const perPla = {};
      plans.forEach(p => {
        const key = p.plaacronim || p.planom;
        if (!perPla[key]) perPla[key] = [];
        perPla[key].push(p);
      });

      // Ordenar per gravetat
      const ordre = { 'EMERGÈNCIA': 0, 'ALERTA': 1, 'PREALERTA': 2 };
      const plaOrdenat = Object.entries(perPla).sort(([, a], [, b]) => {
        const faseA = Math.min(...a.map(p => ordre[p.plafase] ?? 9));
        const faseB = Math.min(...b.map(p => ordre[p.plafase] ?? 9));
        return faseA - faseB;
      });

      let html = `
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;padding:0.5rem 0 1rem;">
          <span style="font-size:0.75rem;color:#999;">Dades del JSON: ${actualitzat}</span>
          <button class="btn-refresh" onclick="carregarPlansPC()">🔄 Actualitza plans PC</button>
        </div>`;

      plaOrdenat.forEach(([nomPla, entrades]) => {
        const fasePitjor = entrades.reduce((prev, cur) =>
          (ordre[cur.plafase] ?? 9) < (ordre[prev.plafase] ?? 9) ? cur : prev
        );
        const cfg = FASE_CONFIG[fasePitjor.plafase] || { color: '#f5f5f5', border: '#ddd', text: '#333', emoji: '⚪' };

        html += `
          <div class="alerta" style="background:${cfg.color};border-color:${cfg.border};margin-bottom:1rem;">
            <div class="alerta-header">
              ${fasePitjor.plaicona ? `<img src="${fasePitjor.plaicona.url}" style="width:40px;height:40px;object-fit:contain;" onerror="this.style.display='none'">` : `<span class="alerta-emoji">${cfg.emoji}</span>`}
              <div>
                <h2 style="color:${cfg.text}">${nomPla}</h2>
                <p>${cfg.emoji} <strong>${fasePitjor.plafase}</strong></p>
              </div>
            </div>`;

        if (entrades.length > 1) {
          html += `<details style="margin-top:0.75rem;"><summary>${entrades.length} avisos actius</summary><div class="details-content">`;
        } else {
          html += `<div style="margin-top:0.75rem;">`;
        }

        entrades.forEach(e => {
          const cfgE = FASE_CONFIG[e.plafase] || cfg;
          html += `
            <div style="background:#fff;border-radius:4px;padding:0.6rem 0.75rem;margin-bottom:0.5rem;border-left:3px solid ${cfgE.border};">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;flex-wrap:wrap;">
                <span style="font-size:0.8rem;font-weight:600;color:${cfgE.text}">${cfgE.emoji} ${e.plafase}</span>
                <span style="font-size:0.75rem;color:#888;">🕐 ${e.fasedatahora || '—'}</span>
              </div>
              ${e.descripcio ? `<p style="margin-top:0.3rem;font-size:0.85rem;color:#555;">${e.descripcio}</p>` : ''}
              ${e.comunicatpdf ? `<a href="${e.comunicatpdf.url}" target="_blank" rel="noopener noreferrer" class="btn-link" style="font-size:0.8rem;padding:4px 10px;margin-top:0.4rem;display:inline-block;">📄 Comunicat CECAT</a>` : ''}
            </div>`;
        });

        if (entrades.length > 1) {
          html += `</div></details>`;
        } else {
          html += `</div>`;
        }
        html += `</div>`;
      });

      cont.innerHTML = html;
    };

    carregarPlansPC();
  </script>
</body>
</html>
