<!DOCTYPE html>
<html lang="ca">
<head>
  <!-- Sentry error monitoring -->
  <script
    src="https://js-de.sentry-cdn.com/e7b9865c80ec5d1d07d39f149d7fb008.min.js"
    crossorigin="anonymous"
  ></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAE - Risc GRAE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      background: #f5f5f5;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 1rem;
      color: #333;
      font-size: 15px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    /* Navegació */
    .nav-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1rem;
      border-bottom: 2px solid #0082d9;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-tab { white-space: nowrap; flex-shrink: 0; }
    
    .nav-tab {
      padding: 0.75rem 1.5rem;
      background: #e8e8e8;
      border: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-size: 0.95rem;
      color: #555;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-right: 2px;
    }
    
    .nav-tab:hover {
      background: #d0d0d0;
    }
    
    .nav-tab.active {
      background: #0082d9;
      color: white;
    }
    
    .nav-tab .badge {
      background: #e53935;
      color: white;
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-weight: 600;
    }
    
    .section {
      display: none;
    }
    
    .section.active {
      display: block;
    }
    
    /* Loading */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      text-align: center;
      color: #666;
    }
    
    .loading-icon {
      font-size: 3rem;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    /* Error */
    .error {
      background: #fff;
      border: 1px solid #e53935;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      max-width: 400px;
      margin: 4rem auto;
    }
    
    .error h2 { color: #e53935; margin: 1rem 0; }
    
    .error button {
      background: #0082d9;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      color: white;
      cursor: pointer;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    
    /* Header */
    header {
      text-align: center;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: #fff;
      border-radius: 4px;
      border-bottom: 3px solid #0082d9;
    }
    
    .header-icon { font-size: 1.5rem; margin-bottom: 0.25rem; }
    
    h1 {
      font-size: 1.2rem;
      color: #0082d9;
      margin-bottom: 0.25rem;
    }
    
    .data { color: #666; font-size: 0.85rem; }
    .actualitzat { font-size: 0.7rem; color: #999; margin-top: 0.25rem; }
    
    /* Alerta / Card */
    .alerta, .card {
      border-radius: 4px;
      padding: 1rem;
      margin-bottom: 1rem;
      border-width: 1px;
      border-style: solid;
      background: #fff;
    }
    
    .card {
      background: #fff;
      border-color: #ddd;
    }
    
    .alerta-header, .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    
    .alerta-emoji, .card-emoji { font-size: 2rem; }
    .alerta h2, .card h2 { font-size: 1.1rem; }
    .alerta p, .card p { margin-top: 0.25rem; color: #555; font-size: 0.9rem; }
    
    .zones-perill {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid #eee;
      font-size: 0.85rem;
      color: #666;
    }
    
    /* Grups */
    .grup {
      margin-bottom: 1rem;
      background: #fff;
      border-radius: 4px;
      padding: 1rem;
      border: 1px solid #ddd;
    }
    
    .grup-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #eee;
    }
    
    .grup-header h3 {
      font-size: 1.1rem;
      color: #333;
    }
    
    .grup-zones {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 0.75rem;
    }
    
    /* Desplegables */
    details {
      margin-top: 0.5rem;
    }
    
    summary {
      cursor: pointer;
      padding: 0.5rem 0.75rem;
      background: #f0f0f0;
      border-radius: 4px;
      font-weight: 500;
      font-size: 0.85rem;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
      color: #333;
    }
    
    summary::-webkit-details-marker {
      display: none;
    }
    
    summary::before {
      content: "▶";
      font-size: 0.6rem;
      transition: transform 0.2s;
      color: #666;
    }
    
    details[open] summary::before {
      transform: rotate(90deg);
    }
    
    summary:hover {
      background: #e5e5e5;
    }
    
    .details-content {
      padding: 0.75rem;
      margin-top: 0.25rem;
      background: #fafafa;
      border-radius: 4px;
      border: 1px solid #eee;
    }
    
    /* Taules */
    .taula-container {
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    
    th, td {
      padding: 0.5rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    
    th {
      color: #666;
      font-weight: 600;
      font-size: 0.8rem;
      background: #f5f5f5;
    }
    
    /* Problemes */
    .problemes {
      border-radius: 4px;
      padding: 0.75rem;
      background: #fafafa;
      border: 1px solid #eee;
    }
    
    .problema-item {
      margin-bottom: 0.5rem;
    }
    
    .problema-item:last-child {
      margin-bottom: 0;
    }
    
    .problema-nom {
      font-weight: 600;
      margin-bottom: 0.15rem;
      font-size: 0.95rem;
      color: #333;
    }
    
    .problema-desc {
      font-size: 0.85rem;
      color: #666;
      line-height: 1.4;
    }
    
    /* Tendència */
    .tendencia {
      background: #e3f2fd;
      border-radius: 4px;
      padding: 0.75rem;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      border-left: 3px solid #0082d9;
    }
    
    .tendencia strong {
      display: block;
      margin-bottom: 0.25rem;
      color: #0082d9;
    }
    
    /* Colors per nivell de perill */
    .perill-5 { background: #212121; border-color: #212121; color: #fff; }
    .perill-5 h2, .perill-5 h3 { color: #fff; }
    .perill-5 p { color: #ddd; }
    
    .perill-4 { background: #ffebee; border-color: #e53935; }
    .perill-4 h2, .perill-4 h3 { color: #c62828; }
    
    .perill-3 { background: #fff3e0; border-color: #f57c00; }
    .perill-3 h2, .perill-3 h3 { color: #e65100; }
    
    .perill-2 { background: #fffde7; border-color: #fbc02d; }
    .perill-2 h2, .perill-2 h3 { color: #f57f17; }
    
    .perill-1 { background: #e8f5e9; border-color: #43a047; }
    .perill-1 h2, .perill-1 h3 { color: #2e7d32; }
    
    /* Colors SMP */
    .nivell-vermell { background: #ffebee; border-color: #e53935; }
    .nivell-vermell h2 { color: #c62828; }
    
    .nivell-taronja { background: #fff3e0; border-color: #f57c00; }
    .nivell-taronja h2 { color: #e65100; }
    
    .nivell-groc { background: #fffde7; border-color: #fbc02d; }
    .nivell-groc h2 { color: #f57f17; }
    
    /* Footer */
    footer {
      text-align: center;
      margin-top: 1.5rem;
      padding: 1rem;
      border-top: 1px solid #ddd;
    }
    
    .btn-pdf, .btn-link {
      display: inline-block;
      background: #0082d9;
      padding: 8px 16px;
      border-radius: 4px;
      color: #fff;
      text-decoration: none;
      margin-bottom: 0.5rem;
      transition: background 0.2s;
      font-size: 0.9rem;
    }
    
    .btn-pdf:hover, .btn-link:hover {
      background: #006bb3;
    }
    
    .font-info {
      font-size: 0.75rem;
      color: #999;
      margin: 0.5rem 0;
    }
    
    .btn-refresh {
      background: #fff;
      border: 1px solid #ddd;
      padding: 6px 14px;
      border-radius: 4px;
      color: #666;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    
    .btn-refresh:hover {
      background: #f5f5f5;
    }
    
    /* Mapa ICGC */
    .mapa-container {
      margin-bottom: 1rem;
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #ddd;
    }
    
    .mapa-container iframe {
      width: 100%;
      height: 450px;
      border: none;
    }
    
    .mapa-fallback {
      padding: 0.5rem;
      text-align: center;
      font-size: 0.8rem;
      background: #f0f0f0;
      color: #666;
    }
    
    .mapa-fallback a {
      color: #0082d9;
    }
    
    /* BPA Layout compacte */
    .bpa-header-compact {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      border: 1px solid;
      margin-bottom: 1rem;
      background: #fff;
    }
    
    .bpa-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .bpa-header-compact .header-icon {
      font-size: 2rem;
      margin: 0;
    }
    
    .bpa-header-compact h1 {
      font-size: 1.1rem;
      margin-bottom: 0.15rem;
    }
    
    .bpa-header-compact .data {
      font-size: 0.85rem;
    }
    
    .bpa-header-compact .actualitzat {
      margin-top: 0.15rem;
      font-size: 0.7rem;
    }
    
    .bpa-header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-align: right;
    }
    
    .bpa-header-right .alerta-emoji {
      font-size: 1.75rem;
    }
    
    .bpa-header-right h2 {
      font-size: 1rem;
      margin-bottom: 0.1rem;
    }
    
    .bpa-header-right p {
      font-size: 0.8rem;
    }
    
    @media (max-width: 800px) {
      .bpa-header-compact {
        flex-direction: column;
        text-align: center;
      }
      .bpa-header-left, .bpa-header-right {
        justify-content: center;
        text-align: center;
      }
    }
    
    /* BPA Main layout amb mapa lateral */
    .bpa-main {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }
    
    .bpa-grups {
      flex: 1;
    }
    
    .bpa-mapa {
      width: 500px;
      min-width: 300px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #ddd;
      flex-shrink: 0;
    }
    
    .bpa-mapa iframe {
      width: 500px;
      height: 500px;
      border: none;
    }
    
    @media (max-width: 900px) {
      .bpa-main {
        flex-direction: column;
      }
      .bpa-mapa {
        width: 100%;
        min-width: auto;
      }
    }

    /* Previsió específic */
    .previsio-dia {
      margin-bottom: 1rem;
    }
    
    .previsio-dia h3 {
      font-size: 1rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #ddd;
      color: #333;
    }
    
    .previsio-variables {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .variable-card {
      background: #fff;
      border-radius: 4px;
      padding: 0.75rem 1rem;
      border: 1px solid #ddd;
    }
    
    .variable-card h4 {
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
      color: #0082d9;
    }
    
    .variable-card .valor {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #444;
    }
    
    /* SMP específic */
    .avis-card {
      border-radius: 4px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      border: 1px solid;
      background: #fff;
    }
    
    .avis-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    
    .avis-header h3 {
      font-size: 1rem;
      color: #333;
    }
    
    .avis-emoji {
      font-size: 1.5rem;
    }
    
    .avis-dies {
      margin-top: 0.75rem;
    }
    
    .avis-dia {
      background: #f5f5f5;
      border-radius: 4px;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
    }
    
    .avis-dia-header {
      font-weight: 600;
      margin-bottom: 0.25rem;
      font-size: 0.85rem;
      color: #333;
    }
    
    .afectacio {
      font-size: 0.8rem;
      padding: 0.35rem;
      background: #fff;
      border-radius: 4px;
      margin-bottom: 0.25rem;
      border: 1px solid #eee;
      color: #555;
    }
    
    .no-alertes {
      text-align: center;
      padding: 2rem;
      background: #e8f5e9;
      border: 1px solid #43a047;
      border-radius: 4px;
    }
    
    .no-alertes .icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }
    
    .no-alertes h3 {
      color: #2e7d32;
    }
    
    /* Taula SMP */
    .smp-taula {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      background: #fff;
    }
    
    .smp-taula th, .smp-taula td {
      padding: 0.4rem;
      text-align: center;
      border: 1px solid #ddd;
    }
    
    .smp-taula th {
      background: #f5f5f5;
      font-weight: 600;
      color: #333;
    }
    
    .smp-taula .zona-nom {
      text-align: left;
      font-weight: 500;
      white-space: nowrap;
      padding-left: 0.5rem;
      color: #333;
    }
    
    .smp-taula .periode-header {
      font-size: 0.7rem;
      color: #666;
      min-width: 45px;
    }
    
    .smp-taula .cel-alerta {
      font-size: 0.9rem;
      cursor: help;
      padding: 0.25rem;
      vertical-align: middle;
    }
    
    .smp-taula .cel-emoji {
      font-size: 0.9rem;
      line-height: 1;
    }
    
    .smp-taula .cel-info {
      font-size: 0.55rem;
      color: #333;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }
    
    .smp-taula .cel-prob {
      font-size: 0.5rem;
      color: #666;
      line-height: 1;
    }
    
    .smp-taula .cel-ok {
      font-size: 0.7rem;
      color: #999;
    }
    
    @media (max-width: 700px) {
      .smp-taula {
        font-size: 0.7rem;
      }
      .smp-taula .zona-nom {
        max-width: 80px;
        white-space: normal;
        font-size: 0.65rem;
      }
      .smp-taula th, .smp-taula td {
        padding: 0.25rem;
      }
      .smp-taula .periode-header {
        font-size: 0.6rem;
      }
    }
    
    /* Mapes SMP costat */
    .mapes-smp {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    
    .mapa-smp-dia {
      flex: 1;
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #ddd;
    }
    
    .mapa-smp-dia h4 {
      text-align: center;
      padding: 0.5rem;
      background: #f5f5f5;
      margin: 0;
      font-size: 0.85rem;
      color: #333;
    }
    
    @media (max-width: 700px) {
      .mapes-smp {
        flex-direction: column;
      }
    }
    
    /* ========== SECCIÓ RISC ========== */
    .risc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: #fff;
      border-radius: 4px;
      border-bottom: 3px solid #e53935;
    }
    
    .risc-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #e53935;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .risc-actions {
      display: flex;
      gap: 0.5rem;
    }
    
    .risc-btn {
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: #fff;
      color: #333;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    
    .risc-btn:hover {
      background: #f5f5f5;
      border-color: #bbb;
    }
    
    .risc-btn-primary {
      background: #e53935;
      border-color: #e53935;
      color: #fff;
      font-weight: 600;
    }
    
    .risc-btn-primary:hover {
      background: #c62828;
    }
    
    .risc-grid {
      display: grid;
      grid-template-columns: 0.8fr 1.6fr 0.8fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    
    @media (max-width: 900px) {
      .risc-grid {
        grid-template-columns: 1fr;
      }
    }
    
    .risc-card {
      background: #fff;
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid #ddd;
      border-top: 4px solid #999;
    }
    
    .risc-card.yesterday { border-top-color: #999; }
    .risc-card.today { border-top-color: #e53935; }
    .risc-card.tomorrow { border-top-color: #ff9800; }
    
    .risc-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    
    .risc-card-label {
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .risc-card-date {
      font-size: 0.95rem;
      font-weight: 600;
      color: #333;
      margin-top: 0.15rem;
    }
    
    .risc-value {
      text-align: center;
      padding: 1rem 0;
    }
    
    .risc-number {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1;
    }
    
    .risc-card.today .risc-number {
      font-size: 5rem;
    }
    
    .risc-level {
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .risc-bar {
      height: 6px;
      background: #eee;
      border-radius: 3px;
      margin: 0.75rem 0;
      overflow: hidden;
    }
    
    .risc-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    
    .risc-breakdown {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid #eee;
    }
    
    .risc-breakdown-title {
      font-size: 0.65rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }
    
    .risc-breakdown-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
      font-size: 0.8rem;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .risc-breakdown-item:last-child {
      border-bottom: none;
    }
    
    .risc-breakdown-label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: #666;
    }
    
    .risc-breakdown-value {
      font-weight: 600;
      color: #333;
    }
    
    .risc-conditions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    
    .risc-condition-card {
      background: #fff;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      border: 1px solid #ddd;
    }
    
    .risc-condition-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    
    .risc-condition-title {
      font-weight: 600;
      font-size: 0.85rem;
      color: #333;
    }
    
    .risc-status {

    // URLs de les fonts de dades

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function fetchAmbTimeout(url, ms = 12000) {
      // Google Apps Script fa redirects i l'AbortSignal no es pot clonar
      // Per URLs de GAS usem Promise.race amb un timer manual
      const esGAS = url.includes('script.google.com') || url.includes('googleapis.com');
      if (esGAS) {
        const timeoutPromise = new Promise((_, reject) =>
          setTimeout(() => reject(new Error('Timeout: ' + url.substring(0,60))), ms)
        );
        return Promise.race([fetch(url), timeoutPromise]);
      }
      // Per la resta (Open-Meteo, Gist, etc.) usem AbortController
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), ms);
      try {
        return await fetch(url, { signal: controller.signal });
      } catch(e) {
        if (e.name === 'AbortError') throw new Error('Timeout: ' + url.substring(0,60));
        throw e;
      } finally {
        clearTimeout(id);
      }
    }

    const calcularSetmanaSanta = (any) => {
      const a = any % 19;
      const b = Math.floor(any / 100);
      const c = any % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const mes = Math.floor((h + l - 7 * m + 114) / 31);
      const dia = ((h + l - 7 * m + 114) % 31) + 1;
      
      // Diumenge de Pasqua
      const pasqua = new Date(any, mes - 1, dia);
      
      // Divendres Sant (2 dies abans)
      const divendresSant = new Date(pasqua);
      divendresSant.setDate(pasqua.getDate() - 2);
      
      // Dilluns de Pasqua (1 dia després)
      const dillunsPasqua = new Date(pasqua);
      dillunsPasqua.setDate(pasqua.getDate() + 1);
      
      return {
        pasqua: pasqua,
        divendresSant: divendresSant,
        dillunsPasqua: dillunsPasqua
      };
    };

      const ponts = [];
      
      festius.forEach(f => {
        const [any, mes, dia] = f.data.split('-').map(Number);
        const data = new Date(any, mes - 1, dia);
        const diaSemana = data.getDay(); // 0=dg, 1=dl, ..., 6=ds
        
        // Festiu en dijous -> pont divendres
        if (diaSemana === 4) {
          const pont = new Date(data);
          pont.setDate(pont.getDate() + 1);
          ponts.push({
            data: formatDateStr(pont),
            nom: `Pont ${f.nom}`,
            nivell: 2,
            auto: true
          });
        }
        // Festiu en dimarts -> pont dilluns
        if (diaSemana === 2) {
          const pont = new Date(data);
          pont.setDate(pont.getDate() - 1);
          ponts.push({
            data: formatDateStr(pont),
            nom: `Pont ${f.nom}`,
            nivell: 2,
            auto: true
          });
        }
        // Festiu en divendres -> cap de setmana llarg (nivell 2)

          ponts.push({
            data: f.data,
            nom: `Cap de setmana llarg ${f.nom}`,
            nivell: 2,

          if (afluenciaEdits[p.data]) {
            afluenciaEdits[p.data].nivell = p.nivell;
            afluenciaEdits[p.data].motiu += ' (pont)';
          }
        } else {
          afluenciaEdits[p.data] = { nivell: p.nivell, motiu: p.nom };
        }
      });
      
      // Aplicar vacances (cada dia del període)
      generadorData.vacances.forEach(v => {

        const [af, mf, df] = v.fi.split('-').map(Number);

      a.click();

    // ========== SECCIÓ RISC OPERACIONAL ==========
    
    let riscState = {

    };
    
    function carregarRiscEstat() {
      const saved = localStorage.getItem('riscGRAE');
      if (saved) {
        riscState = JSON.parse(saved);
      }
      
      const avui = getRiscDateString(0);
      const ahir = getRiscDateString(-1);
      const dema = getRiscDateString(1);
      
      if (!riscState.today || riscState.today.data !== avui) {
        if (riscState.today && riscState.today.data === ahir) {
          riscState.yesterday = riscState.today;
        }
        if (riscState.tomorrow && riscState.tomorrow.data === avui) {
          riscState.today = riscState.tomorrow;
          riscState.today.data = avui;
        } else {
          riscState.today = crearRiscDiaDefault(avui);
        }
        riscState.tomorrow = crearRiscDiaDefault(dema);
      }
      
      if (!riscState.yesterday || riscState.yesterday.data !== ahir) {
        riscState.yesterday = crearRiscDiaDefault(ahir);
      }
      
      if (!riscState.tomorrow || riscState.tomorrow.data !== dema) {
        riscState.tomorrow = crearRiscDiaDefault(dema);
      }
      
      if (!riscState.history) {
        riscState.history = [];
      }
      
      // Carregar configuració de paràmetres
      carregarRiscConfig();

    // Configuració de paràmetres per càlcul automàtic
    let riscParams = {

        "Terres de l'Ebre": 0.3,
      },
      // Mapeig de zona original a grup (per agrupar alertes)
      zonesGrup: {
        'Pirineu Occidental': 'Pirineu Occidental',
        'Pirineu Central': 'Pirineu Occidental',
        'Pirineu Oriental': 'Pirineu Oriental',

    function carregarRiscConfig() {
      const saved = localStorage.getItem('riscGRAE_params');
      if (saved) {
        riscParams = JSON.parse(saved);
      }
    }
    
    function guardarRiscParams() {

    function crearRiscDiaDefault(data) {
      // Obtenir nivell afluència del calendari - rang 0-6
      const infoAflu = getInfoDia(data);
      let afluenciaVal = 0;
      // Nivell 0=0, 1=2, 2=4, 3=6
      if (infoAflu.nivell === 1) afluenciaVal = 2;
      else if (infoAflu.nivell === 2) afluenciaVal = 4;
      else if (infoAflu.nivell >= 3) afluenciaVal = 6;
      
      // Afluencia 0-3: Nivell 0=0, 1=1, 2=2, 3=3
      let afluencia3 = 0;
      if (infoAflu.nivell === 1) afluencia3 = 1;
      else if (infoAflu.nivell === 2) afluencia3 = 2;
      else if (infoAflu.nivell >= 3) afluencia3 = 3;

      return {
        data: data,
        planspc: 0,    // 0-3: 0=cap, 1=prealerta, 2=alerta, 3=emergència
        smp: 0,        // 0-6
        allaus: 0,     // 0-5
        afluencia: afluencia3, // 0-3
        hc: 0,         // 0-2
        canvi: 0,      // 0-2
        notes: '',
        modificat: null
      };
    }
    
    function getRiscDateString(offset = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return d.toISOString().split('T')[0];
    }
    
    function formatRiscDate(dateStr) {
      const d = new Date(dateStr);
      const dies = ['Dg', 'Dl', 'Dt', 'Dc', 'Dj', 'Dv', 'Ds'];
      const mesos = ['gen', 'feb', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'des'];
      return `${dies[d.getDay()]} ${d.getDate()} ${mesos[d.getMonth()]}`;
    }
    
    // Funció per calcular SMP amb lògica simplificada
    function calcularSMPPonderat(data_str) {
      if (!dadesCarregades.smp || !dadesCarregades.smp.avisos) {
        return { punts: 0, valor: 0, detall: [] };
      }
      
      // Comptar zones afectades per nivell (només zones de muntanya)
      // Cada zona compta només pel seu nivell MÀxIM (evita doble comptatge)
      const nivellOrdre = { 'Groc': 1, 'Taronja': 2, 'Vermell': 3 };
      const nivellMaxPerZona = {}; // zonaGrup -> nivell màxim
      
      const detall = [];
      
      for (const avis of dadesCarregades.smp.avisos) {
        const meteor = avis.meteor || '';
        
        for (const dia of (avis.dies || [])) {
          if (dia.dia !== data_str) continue;
          
          for (const afectacio of (dia.afectacions || [])) {
            const zonaOriginal = afectacio.zona || '';
            const nivell = afectacio.nivell || '';
            
            // Mapejar zona original a grup
            const zonaGrup = riscParams.zonesGrup[zonaOriginal] || zonaOriginal;
            const pesZona = riscParams.zones[zonaGrup] || 0;
            
            if (pesZona === 0) continue;  // Zona no rellevant (no està al mapa)
            if (!nivellOrdre[nivell]) continue;
            
            // Guardar el nivell màxim per cada zona
            if (!nivellMaxPerZona[zonaGrup] || nivellOrdre[nivell] > nivellOrdre[nivellMaxPerZona[zonaGrup]]) {
              nivellMaxPerZona[zonaGrup] = nivell;
            }
            
            detall.push({
              meteor,
              nivell,
              zona: zonaGrup
            });
          }
        }
      }

      // Comptar zones per nivell màxim (cada zona compta una sola vegada)
      const zonesPerNivell = { 'Groc': new Set(), 'Taronja': new Set(), 'Vermell': new Set() };
      for (const [zona, nivell] of Object.entries(nivellMaxPerZona)) {
        zonesPerNivell[nivell].add(zona);
      }
      
      const numGroc = zonesPerNivell['Groc'].size;
      const numTaronja = zonesPerNivell['Taronja'].size;
      const numVermell = zonesPerNivell['Vermell'].size;
      
      // Calcular valor segons la lògica
      let valor = 0;
      let explicacio = 'Cap alerta';
      
      if (numVermell >= 3) {
        valor = 6;
        explicacio = `${numVermell} zones vermell (≥3)`;
      } else if (numVermell > 0) {
        valor = 5;
        explicacio = `${numVermell} zones vermell (<3)`;
      } else if (numTaronja >= 3) {
        valor = 4;
        explicacio = `${numTaronja} zones taronja (≥3)`;
      } else if (numTaronja > 0) {
        valor = 3;
        explicacio = `${numTaronja} zones taronja (<3)`;
      } else if (numGroc >= 3) {
        valor = 2;
        explicacio = `${numGroc} zones groc (≥3)`;
      } else if (numGroc > 0) {
        valor = 1;
        explicacio = `${numGroc} zones groc (<3)`;
      }
      
      return {
        valor,
        explicacio,
        zones: {
          groc: numGroc,
          taronja: numTaronja,
          vermell: numVermell
        },
        detall
      };
    }
    
    // Funció per calcular valors automàtics des de les dades carregades
    function calcularValorsAuto(data) {
      const resultat = {
        smp: 0,
        smpDetall: [],
        allaus: 0,
        hc: 0,
        canvi: 0,
        notes: []
      };
      
      // 1. ALERTES SMP - rang 0-6
      const smpCalc = calcularSMPPonderat(data);
      resultat.smp = smpCalc.valor;
      resultat.smpDetall = smpCalc.detall;
      if (smpCalc.valor > 0) {
        resultat.notes.push(`SMP: ${smpCalc.explicacio}`);
      }
      
      // 2. RISC ALLAUS (BPA) - rang 0-5
      // Convertir nivell BPA (1-5) a valor (0-5): nivell 1=0, 2=1, 3=2, 4=3, 5=5... usem (perill-1)*1.25
      if (dadesCarregades.bpa && dadesCarregades.bpa.resum) {
        const perillMax = dadesCarregades.bpa.resum.perill_maxim_numeric || 1;
        // Nivell 1=0, 2=1.25, 3=2.5, 4=3.75, 5=5
        resultat.allaus = Math.round(Math.max(0, (perillMax - 1) * 1.25));
        
        if (perillMax >= 3) {
          resultat.notes.push(`BPA: nivell ${perillMax} → ${resultat.allaus}/5`);
        }
      }
      
      // 3. DIFICULTAT VOL HC - rang 0-2
      // 0=vola, 1=limitació, 2=no vola
      if (dadesCarregades.smp && dadesCarregades.smp.avisos) {
        dadesCarregades.smp.avisos.forEach(avis => {
          avis.dies?.forEach(dia => {
            if (dia.dia === data) {
              const meteor = avis.meteor?.toLowerCase() || '';
              if ((meteor.includes('vent') || meteor.includes('neu')) && avis.nivell === 'Vermell') {
                resultat.hc = Math.max(resultat.hc, 2);
              } else if ((meteor.includes('vent') || meteor.includes('neu') || meteor.includes('pluja')) && avis.nivell === 'Taronja') {
                resultat.hc = Math.max(resultat.hc, 1);
              } else if ((meteor.includes('vent') || meteor.includes('neu')) && avis.nivell === 'Groc') {
                resultat.hc = Math.max(resultat.hc, 1);
              }
            }
          });
        });
        if (resultat.hc > 0) {
          resultat.notes.push(`HC: dificultat ${resultat.hc}/2`);
        }
      }
      
      // 4. CANVI DE TEMPS - rang 0-2 (pendent implementar)

      // 5. PLANS PC - rang 0-3 (0=cap, 1=prealerta, 2=alerta, 3=emergència)
      if (dadesCarregades.planspc && dadesCarregades.planspc.plans) {
        const ordre = { 'EMERGÈNCIA': 3, 'ALERTA': 2, 'PREALERTA': 1 };
        let maxPla = 0;
        dadesCarregades.planspc.plans.forEach(p => {
          const val = ordre[(p.plafase || '').toUpperCase()] || 0;
          if (val > maxPla) maxPla = val;
        });
        resultat.planspc = maxPla;
        if (maxPla > 0) {
          const labels = { 1: 'Prealerta', 2: 'Alerta', 3: 'Emergència' };
          resultat.notes.push(`Plans PC: ${labels[maxPla]}`);
        }
      }
      
      return resultat;
    }
    
    // Funció per actualitzar risc automàticament quan es carreguen dades
    function actualitzarRiscAuto() {
      if (!riscState.today && !riscState.tomorrow) return;
      
      const avui = getRiscDateString(0);
      const dema = getRiscDateString(1);
      
      // Actualitzar avui
      if (riscState.today && !riscState.today.modificatManualment) {
        const valsAvui = calcularValorsAuto(avui);
        riscState.today.smp = valsAvui.smp;
        riscState.today.allaus = valsAvui.allaus;
        riscState.today.hc = valsAvui.hc;
        riscState.today.canvi = valsAvui.canvi;
        riscState.today.planspc = valsAvui.planspc || 0;
        if (valsAvui.notes.length > 0 && !riscState.today.notes) {
          riscState.today.notes = valsAvui.notes.join('. ');
        }
      }
      
      // Actualitzar demà
      if (riscState.tomorrow && !riscState.tomorrow.modificatManualment) {
        const valsDema = calcularValorsAuto(dema);
        riscState.tomorrow.smp = valsDema.smp;
        riscState.tomorrow.allaus = valsDema.allaus;
        riscState.tomorrow.hc = valsDema.hc;
        riscState.tomorrow.canvi = valsDema.canvi;
        riscState.tomorrow.planspc = valsDema.planspc || 0;
        if (valsDema.notes.length > 0 && !riscState.tomorrow.notes) {
          riscState.tomorrow.notes = valsDema.notes.join('. ');
        }
      }
      
      // Guardar i renderitzar
      localStorage.setItem('riscGRAE', JSON.stringify(riscState));
      renderRisc();
    }
    
    function calcularRisc(dia) {
      // Rangs: planspc 0-3, smp 0-6, allaus 0-5, afluencia 0-3, hc 0-2, canvi 0-2
      // Total màxim teòric: 3+6+5+3+2+2 = 21, normalitzem a 0-6
      const total = parseFloat(dia.planspc||0) + parseFloat(dia.smp||0) + parseFloat(dia.allaus||0) +
                    parseFloat(dia.afluencia||0) + parseFloat(dia.hc||0) + parseFloat(dia.canvi||0);
      return Math.min(6, Math.round((total / 21) * 6));
    }
    
    function getRiscLabel(risc) {
      if (risc <= 1.5) return 'BAIX';
      if (risc <= 3) return 'MODERAT';
      if (risc <= 4.5) return 'ALT';
      return 'MOLT ALT';
    }
    
    function getRiscColorClass(risc) {
      return 'risc-color-' + Math.min(6, Math.floor(risc));
    }
    
    function getRiscBgClass(risc) {
      return 'risc-bg-' + Math.min(6, Math.floor(risc));
    }
    
    function getPlanspcLabel(val) {
      if (val == 0) return 'Cap pla activat';
      if (val == 1) return 'Prealerta';
      if (val == 2) return 'Alerta';
      return 'Emergència';
    }

    function getAfluenciaLabel(val) {
      if (val == 0) return 'Normal';
      if (val == 1) return 'Moderat';
      if (val == 2) return 'Alt';
      return 'Molt alt';
    }
    
    function getHCLabel(val) {
      if (val == 0) return 'Vol normal';
      if (val == 1) return 'Dificultats';
      return 'Molt difícil';
    }
    
    function getSMPLabelRisc(val) {
      if (val == 0) return 'Cap alerta';
      if (val <= 2) return 'Avís groc';
      if (val <= 4) return 'Alerta taronja';
      return 'Alerta vermella';
    }
    
    function getCanviLabel(val) {
      if (val == 0) return 'Estable tot el dia';
      if (val == 1) return 'Canvi a partir tarda/migdia';
      return 'Canvi a partir matí';
    }
    
    function getAllausLabel(val) {
      if (val == 0) return 'Feble';
      if (val == 1) return 'Moderat';
      if (val == 3) return 'Marcat';
      if (val == 4) return 'Fort';
      if (val == 5) return 'Molt fort';
      return 'Feble';
    }

    function renderErrorLog() {
      if (errorLog.length === 0) return '<div style="color:#aaa;padding:0.5rem;">Cap error registrat.</div>';
      return errorLog.map(e => {
        const d = new Date(e.ts);
        const hora = d.toLocaleTimeString('ca', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
        const data = d.toLocaleDateString('ca');
        const color = '#c62828';
        return `<div style="border-left:3px solid ${color};padding:0.4rem 0.75rem;margin-bottom:0.4rem;background:#fff8f8;border-radius:0 4px 4px 0;">
          <div style="display:flex;justify-content:space-between;">
            <span style="font-weight:700;color:${color};">${e.font}</span>
            <span style="color:#aaa;font-size:0.75rem;">${data} ${hora}</span>
          </div>
          <div style="color:#333;margin-top:0.15rem;">${e.missatge}</div>
          ${e.detall ? `<div style="color:#888;font-size:0.75rem;margin-top:0.1rem;">${e.detall}</div>` : ''}
        </div>`;
      }).join('');
    }

    function tancarRiscModal() {
      document.getElementById('risc-modal').classList.remove('active');

    function guardarRiscConfig() {
      const day = document.getElementById('risc-config-day').value;
      const dia = riscState[day];
      const motiu = document.getElementById('risc-config-motiu').value;
      
      const camps = ['planspc', 'smp', 'allaus', 'afluencia', 'hc', 'canvi', 'boletaires'];
      const labels = {
        planspc: 'Plans PC',
        smp: 'Alertes SMP',
        allaus: 'Risc allaus',
        afluencia: 'Afluència',
        hc: 'Dificultat HC',
        canvi: 'Canvi temps',
        boletaires: 'Boletaires'
      };
      
      camps.forEach(camp => {
        const nouValor = document.getElementById('risc-config-' + camp).value;
        if (dia[camp] != nouValor) {
          riscState.history.push({
            timestamp: new Date().toISOString(),
            dia: day === 'today' ? 'Avui' : 'Demà',
            camp: labels[camp],
            valorAnterior: dia[camp],
            valorNou: nouValor,
            motiu: motiu
          });
          dia[camp] = nouValor;
        }
      });
      
      dia.notes = document.getElementById('risc-config-notes').value;
      dia.modificat = new Date().toISOString();
      dia.modificatManualment = true;  // Marcar que s'ha editat manualment
      
      localStorage.setItem('riscGRAE', JSON.stringify(riscState));
      renderRisc();
      tancarRiscModal();
    }

      a.click();
      URL.revokeObjectURL(url);

    async function enviarRiscGAS(dataStr, edicions) {
      const data = dataStr || getRiscDateString(0);
      const dia = dataStr ? null : riscState.today;
      const risc = dia ? calcularRisc(dia) : null;

      const resultatEl = document.getElementById('enviar-resultat');
      if (resultatEl) {
        resultatEl.style.display = 'block';
        resultatEl.innerHTML = '<span style="color:#666;">Guardant a Supabase...</span>';
      }

      if (!dia) {
        if (resultatEl) resultatEl.innerHTML = '<span style="color:#e53935;">⚠️ No hi ha dades del dia</span>';
        return;
      }

      const factors = {
        planspc: Math.round(dia.planspc || 0),
        smp: Math.round(dia.smp || 0),
        allaus: Math.round(dia.allaus || 0),
        afluencia: Math.round(dia.afluencia || 0),
        hc: Math.round(dia.hc || 0),
        canvi: Math.round(dia.canvi || 0),
        boletaires: Math.round(dia.boletaires || 0)
      };

      const res = await guardarRiscSupabase(data, risc, factors, dia.notes);
      if (resultatEl) {
        resultatEl.innerHTML = res.ok
          ? '<span style="color:#2e7d32;">✅ Guardat a Supabase</span>'
          : '<span style="color:#e53935;">❌ Error: ' + (res.error || 'desconegut') + '</span>';
      }
    }

      const edicions = riscState.history || [];
      const avui = getRiscDateString(0);
      const edicionsAvui = edicions.filter(e => e.timestamp && e.timestamp.startsWith(avui));
      await enviarRiscGAS(avui, edicionsAvui);
    }

    async function geocodificar(lloc) {
      // Nominatim OpenStreetMap geocoding - afegim "Catalunya" per millorar resultats
      const q = encodeURIComponent(lloc + ', Catalunya');
      try {
        const resp = await fetch('https://nominatim.openstreetmap.org/search?q=' + q + '&format=json&limit=1&countrycodes=es', {
          headers: { 'Accept-Language': 'ca' }
        });
        const data = await resp.json();
        if (data && data.length > 0) {
          return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        }
      } catch(e) {}
      return null;
    }

    async function carregarDadesHelicoptersDia(dataStr) {
      const url = URLS.helicopters;
      if (!url || url === 'HELICOPTERS_GAS_URL') {
        helicopterDadesActuals = JSON.parse(JSON.stringify(HELICOPTERS_BASE));
        renderTaulaHelicopters();
        document.getElementById('heli-status').textContent = 'Per defecte';
        return;
      }
      try {
        document.getElementById('heli-status').textContent = 'Carregant...';
        const resp = await fetchAmbTimeout(url + '?accio=getDia&data=' + dataStr);
        const dades = await resp.json();
        helicopterDadesActuals = dades.helicopters && dades.helicopters.length > 0
          ? dades.helicopters
          : JSON.parse(JSON.stringify(HELICOPTERS_BASE));
        renderTaulaHelicopters();
        if (!dades.noDades) {
          document.getElementById('heli-status').textContent = '✅ ' + dataStr;
        } else if (dades.fontData) {
          document.getElementById('heli-status').textContent = '📋 Dades de ' + dades.fontData;
        } else {
          document.getElementById('heli-status').textContent = 'Per defecte';
        }
      } catch(e) {
        helicopterDadesActuals = JSON.parse(JSON.stringify(HELICOPTERS_BASE));
        renderTaulaHelicopters();
        document.getElementById('heli-status').textContent = '⚠️ Error GAS';
      }
    }

    function renderTaulaHelicopters() {

        const optsHTML = HELI_OPERATIVITAT.map(op =>
          `<option value="${op}" ${h.operativitat === op ? 'selected' : ''}>${op}</option>`
        ).join('');
        const opColor = h.operativitat === 'Total' ? '#2e7d32' :
                        h.operativitat === 'Parcial' ? '#e65100' :
                        h.operativitat === 'Sense grua' ? '#f57f17' : '#888';
        return `<tr data-idx="${i}" style="border-bottom:1px solid #f0f0f0;">
          <td style="padding:0.35rem 0.75rem;">
            <div style="display:flex;align-items:center;gap:0.4rem;">
  <span style="width:10px;height:10px;border-radius:50%;background:#1a1a2e;flex-shrink:0;display:inline-block;"></span>
              <input type="text" value="${h.recurs||''}"
                style="width:100%;border:1px solid #e0e0e0;border-radius:3px;padding:0.2rem 0.4rem;font-size:0.82rem;font-weight:600;"
                onchange="heliActualitzarCamp(${i},'recurs',this.value);heliAutoSave()">
            </div>
          </td>
          <td style="padding:0.35rem 0.75rem;">
            <input type="text" value="${h.base||''}"
              style="width:100%;border:1px solid #e0e0e0;border-radius:3px;padding:0.2rem 0.4rem;font-size:0.82rem;"
              onblur="heliActualitzarBase(${i},this.value)"
              onkeydown="if(event.key==='Enter'){heliActualitzarBase(${i},this.value)}"
              placeholder="Nom del lloc...">
          </td>
          <td style="padding:0.35rem 0.75rem;">
            <select style="width:100%;border:1px solid #e0e0e0;border-radius:3px;padding:0.2rem 0.4rem;font-size:0.82rem;color:${opColor};font-weight:600;"
              onchange="heliActualitzarCamp(${i},'operativitat',this.value);heliAutoSave()">
              ${optsHTML}
            </select>
          </td>
          <td style="padding:0.35rem 0.75rem;">
            <input type="text" value="${h.observacions||''}"
              style="width:100%;border:1px solid #e0e0e0;border-radius:3px;padding:0.2rem 0.4rem;font-size:0.82rem;"
              placeholder="—"
              onchange="heliActualitzarCamp(${i},'observacions',this.value);heliAutoSave()">
          </td>
          <td style="padding:0.35rem 0.5rem;text-align:center;">
            <button onclick="eliminarHelicopter(${i})"

          </td>
        </tr>`;
      }).join('');

      actualitzarMarcadors();
      renderIndexos();
      // Carregar meteo quan hi ha coordenades
      setTimeout(carregarMeteoHelicopters, 300);

    async function heliActualitzarBase(idx, valor) {
      if (!valor) return;
      helicopterDadesActuals[idx].base = valor;

      // Geocodificar
      document.getElementById('heli-status').textContent = '📍 Cercant...';
      const coords = await geocodificar(valor);
      if (coords) {
        helicopterDadesActuals[idx].lat = coords.lat;
        helicopterDadesActuals[idx].lon = coords.lon;
        document.getElementById('heli-status').textContent = '📍 Trobat';
        actualitzarMarcadors();
      } else {
        document.getElementById('heli-status').textContent = '⚠️ Lloc no trobat';
      }
      heliAutoSave();
    }

    function heliActualitzarCamp(idx, camp, valor) {
      helicopterDadesActuals[idx][camp] = valor;
      if (camp === 'operativitat') renderTaulaHelicopters();
    }

    function afegirHelicoter() {
      helicopterDadesActuals.push({
        id: 'h' + Date.now(),
        recurs: '', base: '', lat: null, lon: null,
        operativitat: 'Total', observacions: ''
      });
      renderTaulaHelicopters();
      heliAutoSave();
    }

    function eliminarHelicopter(idx) {
      if (helicopterDadesActuals.length <= 1) return;
      helicopterDadesActuals.splice(idx, 1);
      renderTaulaHelicopters();
      heliAutoSave();
    }

    function actualitzarMarcadors() {
      if (!helicopterMap) return;
      Object.values(helicopterMarkers).forEach(m => helicopterMap.removeLayer(m));
      helicopterMarkers = {};

      // Agrupar helicòpters per coordenada (~100m)
      const grups = {};
      helicopterDadesActuals.forEach((h, i) => {
        if (!h.lat || !h.lon) return;
        const key = parseFloat(h.lat).toFixed(3) + ',' + parseFloat(h.lon).toFixed(3);
        if (!grups[key]) grups[key] = { lat: parseFloat(h.lat), lon: parseFloat(h.lon), helis: [] };
        grups[key].helis.push({ h, i });
      });

      Object.values(grups).forEach(grup => {
        const { lat, lon, helis } = grup;

        const etiquetes = helis.map(({ h }) => {
          const opBg = h.operativitat === 'Total' ? '#2e7d32' :
                       h.operativitat === 'Parcial' ? '#e65100' :
                       h.operativitat === 'Sense grua' ? '#f9a825' : 'rgba(240,240,240,0.95)';
          const opText = h.operativitat === 'Baixa' ? '#555' : 'white';
          const shadow = opText === 'white' ? '0 1px 2px rgba(0,0,0,0.5)' : 'none';
          return `<div style="background:${opBg};color:${opText};padding:4px 10px;border-radius:12px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,0.35);text-shadow:${shadow};margin-bottom:3px;">&#x1F681; ${h.recurs||'?'}</div>`;
        }).join('');

        const popupHTML = helis.map(({ h }) =>
          `<strong>&#x1F681; ${h.recurs||'?'}</strong> &mdash; ${h.base||''}<br>&#x2699;&#xFE0F; ${h.operativitat||''}${h.observacions ? ' &middot; '+h.observacions : ''}`
        ).join('<hr style="margin:4px 0;">');

        const icon = L.divIcon({
          html: `<div style="display:flex;flex-direction:column;align-items:flex-start;">${etiquetes}</div>`,
          className: '',
          iconAnchor: [0, helis.length * 16]
        });

        const marker = L.marker([lat, lon], { icon, draggable: true })
          .addTo(helicopterMap)
          .bindPopup(popupHTML);

        marker.on('dragend', function(e) {
          const pos = e.target.getLatLng();
          helis.forEach(({ i }) => {
            helicopterDadesActuals[i].lat = parseFloat(pos.lat.toFixed(5));
            helicopterDadesActuals[i].lon = parseFloat(pos.lng.toFixed(5));
          });
          heliAutoSave();
        });

        helis.forEach(({ i }) => { helicopterMarkers[i] = marker; });
      });
    }



    // ===== ÍNDEXS DISTRIBUCIÓ I OPERATIVITAT =====
    function provinciaDeBase(base) {
      if (!base) return null;
      const b = base.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      // Girona
      const girona = ["girona","figueres","olot","ripoll","vic","manlleu","banyoles","blanes","lloret","santa coloma de farners","la bisbal","palafrugell","palamos","roses","escala","la jonquera","puigcerda","cerdanya","camprodon","sant feliu"];
      if (girona.some(x => b.includes(x))) return "Girona";
      // Tarragona
      const tarragona = ["tarragona","reus","tortosa","valls","el vendrell","amposta","ametlla","calafell","cambrils","salou","mont-roig","gandesa","mora","deltebre","rapita","ebre"];
      if (tarragona.some(x => b.includes(x))) return "Tarragona";
      // Lleida
      const lleida = ["lleida","balaguer","cervera","igualada","solsona","tremp","sort","vielha","seu d urgell","la seu","ponts","mollerussa","tarrega","artesa","pobla de segur","pont de suert"];
      if (lleida.some(x => b.includes(x))) return "Lleida";
      // Barcelona
      const barcelona = ["barcelona","sabadell","terrassa","badalona","hospitalet","mataro","granollers","mollet","montcada","rubi","sant cugat","vilafranca","vilanova","berga","cardona","torello","puig-reig","navarcles","manresa","sant joan","martorell","abrera","esparreguera"];
      if (barcelona.some(x => b.includes(x))) return "Barcelona";
      return null; // no identificat
    }

    function provinciaDeCoords(lat, lon) {
      // Fallback per coordenades quan no es pot determinar per nom
      if (lat >= 41.7 && lon >= 2.3) return 'Girona';
      if (lat < 41.35) return 'Tarragona';
      if (lat < 41.5 && lon >= 0.8 && lon < 2.3) return 'Tarragona';
      if (lon < 1.3) return 'Lleida';
      if (lon < 1.85 && lat >= 41.5) return 'Lleida';
      return 'Barcelona';
    }

    function calcularIndexos() {
      const helis = helicopterDadesActuals.filter(h => h.lat && h.lon);

      // Distribució: quantes províncies diferents tenen almenys 1 HC operatiu (no Baixa)
      const provinciesAmbHeli = new Set();
      const debugHelis = [];
      helis.forEach(h => {
        const op = (h.operativitat || '').trim();
        const prov = provinciaDeBase(h.base) || provinciaDeCoords(parseFloat(h.lat), parseFloat(h.lon));
        debugHelis.push({ recurs: h.recurs, base: h.base, lat: h.lat, lon: h.lon, op, prov });
        if (op !== 'Baixa') {
          provinciesAmbHeli.add(prov);
        }
      });
      const distribucio = provinciesAmbHeli.size;

      // Operativitat: Total=1, Parcial/Sense grua=0.5, Baixa=0
      let opTotal = 0;
      helis.forEach(h => {
        const op = (h.operativitat || '').trim();
        if (op === 'Total') opTotal += 1;
        else if (op !== 'Baixa') opTotal += 0.5;
      });
      const operativitat = Math.min(4, opTotal);

      return { distribucio, operativitat, provinciesAmbHeli: [...provinciesAmbHeli], debugHelis };
    }

      const colorIdx = (val) => val >= 3.5 ? '#2e7d32' : val >= 2.5 ? '#f57f17' : val >= 1 ? '#e65100' : '#c62828';
      const colorDist = colorIdx(distribucio);
      const colorOp = colorIdx(operativitat);

      const totesProv = ['Barcelona','Girona','Lleida','Tarragona'];

      }).join('');

      cont.innerHTML = `
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:stretch;">
          <div style="flex:1;min-width:160px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:0.6rem 0.9rem;border-left:4px solid ${colorDist};">

            <div style="font-size:0.7rem;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:0.3rem;">Operativitat</div>
            <div style="display:flex;align-items:baseline;gap:0.4rem;">
              <span style="font-size:2rem;font-weight:800;color:${colorOp};line-height:1;">${operativitat % 1 === 0 ? operativitat : operativitat.toFixed(1)}</span>

          </div>
        </div>
        <details style="margin-top:0.4rem;font-size:0.72rem;color:#aaa;padding:0 1rem 0.5rem;">

          <div id="heli-debug-idx"></div>

    // ===== OPEN-METEO PER HELICÒPTERS =====
    // Codis WMO rellevants per vol
    function wmoDescripcio(code) {
      if (code === 0) return 'Cel clar';
      if (code <= 3) return 'Ennuvolat';
      if (code <= 9) return 'Boira/neblina';
      if (code === 45 || code === 48) return '🌫️ Boira';
      if (code <= 49) return 'Boira';
      if (code <= 59) return '🌦️ Plugim';
      if (code <= 69) return '🌧️ Pluja';
      if (code <= 79) return '❄️ Neu';
      if (code <= 82) return '🌧️ Ruixats';
      if (code <= 86) return '❄️ Ruixats neu';
      if (code <= 99) return '⛈️ Tempesta';
      return 'Desconegut';
    }

    function volSemafor(visibilitat, nuvolsBaixos, ventRatxa, wmo) {
      // Criteris simplificats per vol VFR helicòpter rescat
      const boira = (wmo === 45 || wmo === 48 || (wmo >= 10 && wmo <= 12));
      const visKm = visibilitat / 1000;

      if (boira || visKm < 1.5) return { color: '#c62828', text: '🔴 No recomanat', detall: 'Visibilitat crítica' };
      if (visKm < 3 || nuvolsBaixos > 75) return { color: '#e65100', text: '🟠 Condicionat', detall: 'Visibilitat/núvols limitants' };
      if (ventRatxa > 60 || nuvolsBaixos > 50) return { color: '#f57f17', text: '🟡 Precaució', detall: 'Vent fort o núvols baixos' };
      return { color: '#2e7d32', text: '🟢 Favorable', detall: 'Condicions acceptables' };
    }

    async function carregarMeteoHelicopters() {
      const helis = helicopterDadesActuals.filter(h => h.lat && h.lon);
      if (helis.length === 0) return;

      const cont = document.getElementById('heli-meteo-cont');
      if (!cont) return;
      cont.innerHTML = '<div style="color:#aaa;font-size:0.8rem;padding:0.5rem;">Carregant dades meteorològiques...</div>';

      const ara = new Date();
      const horaActual = ara.getHours();
      const avuiStr = ara.toISOString().substring(0,10);
      const dema = new Date(ara); dema.setDate(dema.getDate()+1);
      const demaStr = dema.toISOString().substring(0,10);

      // Orto, ocàs i crepuscle (usem la primera base disponible)
      try {
        const h0 = helis[0];
        const urlSol = 'https://api.open-meteo.com/v1/forecast?' +
          'latitude=' + h0.lat + '&longitude=' + h0.lon +
          '&daily=sunrise,sunset&forecast_days=2&timezone=Europe%2FMadrid';
        const rSol = await fetch(urlSol);
        const dSol = await rSol.json();
        const contSol = document.getElementById('heli-sol-cont');
        if (contSol && dSol.daily) {
          const dies = ['Avui', 'Demà'];
          contSol.innerHTML = dSol.daily.time.map((data, i) => {
            const sunrise = dSol.daily.sunrise[i].substring(11,16);
            const sunset  = dSol.daily.sunset[i].substring(11,16);
            // Crepuscle civil ~30min abans/després
            const addMin = (hhmm, mins) => {
              const [h, m] = hhmm.split(':').map(Number);
              const total = h*60 + m + mins;
              return String(Math.floor(((total%1440)+1440)%1440/60)).padStart(2,'0') + ':' + String(((total%1440)+1440)%60).padStart(2,'0');
            };
            const crepMati = addMin(sunrise, -30);
            const crepVesp = addMin(sunset, 30);
            return `<div style="flex:1;min-width:160px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:0.6rem 0.9rem;">
              <div style="font-size:0.72rem;font-weight:700;color:#888;margin-bottom:0.4rem;text-transform:uppercase;">${dies[i]} · ${data}</div>
              <div style="display:flex;gap:0.75rem;flex-wrap:wrap;font-size:0.82rem;">
                <div title="Crepuscle matutí">🌅 <strong>${crepMati}</strong> <span style="color:#aaa;font-size:0.7rem;">crep.</span></div>
                <div title="Orto">☀️ <strong>${sunrise}</strong> <span style="color:#aaa;font-size:0.7rem;">orto</span></div>
                <div title="Ocàs">🌇 <strong>${sunset}</strong> <span style="color:#aaa;font-size:0.7rem;">ocàs</span></div>
                <div title="Crepuscle vespertí">🌆 <strong>${crepVesp}</strong> <span style="color:#aaa;font-size:0.7rem;">crep.</span></div>
              </div>
            </div>`;
          }).join('');
        }
      } catch(e) {}

      // Agrupar per coordenades
      const coordsVistes = new Set();
      const resultats = [];

      for (const h of helis) {
        const key = parseFloat(h.lat).toFixed(2) + ',' + parseFloat(h.lon).toFixed(2);
        if (coordsVistes.has(key)) continue;
        coordsVistes.add(key);

        try {
          const url = 'https://api.open-meteo.com/v1/forecast?' +
            'latitude=' + h.lat + '&longitude=' + h.lon +
            '&hourly=visibility,cloud_cover_low,wind_speed_10m,wind_gusts_10m,weather_code' +
            '&forecast_days=2&timezone=Europe%2FMadrid&wind_speed_unit=kmh';

          const resp = await fetch(url);
          const data = await resp.json();
          const times = data.hourly.time;

          // Hora actual
          const idxAra = horaActual;

          // Hores d'avui restants (cada 2h)
          const horesAvui = [];
          for (let h2 = horaActual; h2 <= 23; h2 += 2) {
            const idx = times.findIndex(t => t === avuiStr + 'T' + String(h2).padStart(2,'0') + ':00');
            if (idx >= 0) horesAvui.push({ hora: String(h2).padStart(2,'0')+'h', idx });
          }

          // Hores de demà (cada 3h: 6, 9, 12, 15, 18)
          const horesDema = [6,9,12,15,18].map(h2 => {
            const idx = times.findIndex(t => t === demaStr + 'T' + String(h2).padStart(2,'0') + ':00');
            return idx >= 0 ? { hora: String(h2).padStart(2,'0')+'h', idx } : null;
          }).filter(Boolean);

          const get = (arr, idx, key) => arr[key] ? arr[key][idx] : null;
          const d = data.hourly;

          resultats.push({
            h, key,
            ara: { vis: d.visibility[idxAra], nuv: d.cloud_cover_low[idxAra], vent: d.wind_speed_10m[idxAra], ratxa: d.wind_gusts_10m[idxAra], wmo: d.weather_code[idxAra] },
            horesAvui: horesAvui.map(({hora,idx}) => ({ hora, vis: d.visibility[idx], nuv: d.cloud_cover_low[idx], ratxa: d.wind_gusts_10m[idx], wmo: d.weather_code[idx] })),
            horesDema: horesDema.map(({hora,idx}) => ({ hora, vis: d.visibility[idx], nuv: d.cloud_cover_low[idx], ratxa: d.wind_gusts_10m[idx], wmo: d.weather_code[idx] }))
          });
        } catch(e) {
          resultats.push({ h, error: true, key });
        }
      }

      function renderHores(hores) {
        return hores.map(p => {
          const s = volSemafor(p.vis, p.nuv, p.ratxa, p.wmo);
          const ico = p.wmo===0?'☀️':p.wmo<=3?'⛅':p.wmo<=12?'🌫️':p.wmo<=67?'🌧️':p.wmo<=77?'❄️':'⛈️';
          return `<div style="text-align:center;min-width:40px;">
            <div style="font-size:0.65rem;color:#888;">${p.hora}</div>
            <div style="font-size:0.9rem;">${ico}</div>
            <div style="font-size:0.65rem;color:${s.color};font-weight:700;">${(p.vis/1000).toFixed(1)}km</div>
          </div>`;
        }).join('');
      }

      function renderTargeta(r, diaLabel, hores, destacat) {
        const sem = volSemafor(r.vis, r.nuv, r.ratxa, r.wmo);
        const visKm = (r.vis/1000).toFixed(1);
        const border = destacat ? `border:2px solid ${sem.color}` : `border:1px solid #e0e0e0`;
        return `<div style="background:#fff;${border};border-radius:8px;padding:0.6rem 0.9rem;border-left:4px solid ${sem.color};">
          <div style="font-size:0.72rem;font-weight:700;color:#888;margin-bottom:0.3rem;text-transform:uppercase;">${diaLabel}</div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.4rem;">
            <div>
              <div style="font-size:0.95rem;font-weight:700;color:${sem.color};">${sem.text}</div>
              <div style="font-size:0.72rem;color:#888;">${sem.detall}</div>
            </div>
            <div style="font-size:0.78rem;color:#555;text-align:right;">
              <div>👁️ <strong>${visKm}km</strong> · ☁️ <strong>${r.nuv}%</strong></div>
              <div>💨 <strong>${Math.round(r.vent)} km/h</strong> · ↑ <strong>${Math.round(r.ratxa)}</strong></div>
            </div>
          </div>
          <div style="display:flex;gap:0.2rem;margin-top:0.4rem;padding-top:0.4rem;border-top:1px solid #f0f0f0;flex-wrap:wrap;">
            ${renderHores(hores)}
          </div>
        </div>`;
      }

      // Pitjor cas de demà (hora 9-18)
      function pitjorDema(hores) {
        if (!hores.length) return null;
        return hores.reduce((worst, h2) => {
          const s = volSemafor(h2.vis, h2.nuv, h2.ratxa, h2.wmo);
          const sw = volSemafor(worst.vis, worst.nuv, worst.ratxa, worst.wmo);
          const ord = {'🟢 Favorable':0,'🟡 Precaució':1,'🟠 Condicionat':2,'🔴 No recomanat':3};
          return (ord[s.text]||0) > (ord[sw.text]||0) ? h2 : worst;
        });
      }

      cont.innerHTML = resultats.map(r => {
        if (r.error) return `<div style="padding:0.5rem;color:#e53935;font-size:0.8rem;">⚠️ Error ${r.h.base||r.h.recurs}</div>`;

        const helisBase = helicopterDadesActuals.filter(hh => hh.lat && hh.lon &&
          parseFloat(hh.lat).toFixed(2) === parseFloat(r.h.lat).toFixed(2) &&
          parseFloat(hh.lon).toFixed(2) === parseFloat(r.h.lon).toFixed(2)
        ).map(hh => hh.recurs).join(', ');

        const demaResumData = pitjorDema(r.horesDema) || r.horesDema[0];

        return `<div style="background:#f9f9f9;border:1px solid #ddd;border-radius:8px;padding:0.75rem;margin-bottom:0.75rem;">
          <div style="font-weight:700;font-size:0.9rem;margin-bottom:0.6rem;">🚁 ${helisBase} — ${r.h.base||'?'}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;">
            ${renderTargeta(r.ara, '📅 Avui', r.horesAvui, true)}
            ${demaResumData ? renderTargeta(demaResumData, '📅 Demà', r.horesDema, false) : '<div style="color:#aaa;font-size:0.8rem;">Sense dades demà</div>'}
          </div>
        </div>`;
      }).join('');
    }

    async function canviarDataHelicopters(dataStr) {
      helicopterDataActual = dataStr;
      await carregarDadesHelicoptersDia(dataStr);
    }

    let heliAutoSaveTimer = null;
    function heliAutoSave() {
      clearTimeout(heliAutoSaveTimer);
      document.getElementById('heli-status').textContent = '...';
      heliAutoSaveTimer = setTimeout(() => guardarHelicopters(), 1500);
    }

    async function guardarHelicopters() {
      const url = URLS.helicopters;
      if (!url || url === 'HELICOPTERS_GAS_URL') {
        document.getElementById('heli-status').textContent = '⚠️ URL no configurada';
        return;
      }
      const btn = document.getElementById('heli-btn-guardar');
      btn.disabled = true;
      document.getElementById('heli-status').textContent = 'Guardant...';
      try {
        const resp = await fetch(url, {
          method: 'POST',
          body: JSON.stringify({
            accio: 'guardarDia',
            data: helicopterDataActual,
            helicopters: helicopterDadesActuals
          })
        });
        const res = await resp.json();
        document.getElementById('heli-status').textContent = res.ok ? '✅ Guardat' : '❌ ' + (res.error||'Error');
      } catch(e) {
        document.getElementById('heli-status').textContent = '❌ ' + e.message;
      }
      btn.disabled = false;
    }

    // ==================== PLANS PC ====================
    const FASE_CONFIG = {
      'EMERGÈNCIA': { color: '#ffebee', border: '#e53935', text: '#c62828', emoji: '🔴' },
      'ALERTA':     { color: '#fff3e0', border: '#f57c00', text: '#e65100', emoji: '🟠' },
      'PREALERTA':  { color: '#fffde7', border: '#fbc02d', text: '#f57f17', emoji: '🟡' }
    };

    const carregarPlansPC = async () => {
      const cont = document.getElementById('app-planspc');
      cont.innerHTML = `<div class="loading"><div class="loading-icon">🚨</div><p style="margin-top:1rem;opacity:0.8;">Carregant plans de protecció civil...</p></div>`;
      try {
        const resp = await fetchAmbTimeout(URLS.planspc);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        dadesCarregades.planspc = data;
        actualitzarRiscAuto();
        renderPlansPC(data);
      } catch (e) {
        cont.innerHTML = `
          <div class="error">
            <div style="font-size:2rem">⚠️</div>
            <h2>Error en carregar</h2>
            <p style="color:#666;font-size:0.9rem">${e.message}</p>
            <button onclick="carregarPlansPC()">Tornar a provar</button>
          </div>`;
      }
    };

    const renderPlansPC = (data) => {
      const cont = document.getElementById('app-planspc');
      const plans = data.plans || [];
      const actualitzat = data.actualitzat ? new Date(data.actualitzat).toLocaleString('ca-ES') : '—';

      // Actualitzar badge
      const badge = document.getElementById('badge-planspc');
      const emergencies = plans.filter(p => p.plafase === 'EMERGÈNCIA').length;
      const alertes = plans.filter(p => p.plafase === 'ALERTA').length;
      if (emergencies > 0) {
        badge.textContent = emergencies;
        badge.style.display = 'inline';
        badge.style.background = '#e53935';
      } else if (alertes > 0) {
        badge.textContent = alertes;
        badge.style.display = 'inline';
        badge.style.background = '#f57c00';
      } else {
        badge.style.display = 'none';
      }

      if (plans.length === 0) {
        cont.innerHTML = `
          <div style="text-align:center;padding:1rem 0 0.5rem;">
            <span style="font-size:0.75rem;color:#999;">Dades del JSON: ${actualitzat}</span>
            <button class="btn-refresh" onclick="carregarPlansPC()" style="margin-left:0.75rem;">🔄 Actualitza plans PC</button>
          </div>
          <div class="no-alertes" style="margin-top:0.75rem;">
            <div class="icon">✅</div>
            <h3>Cap pla de protecció civil activat</h3>
            <p style="color:#555;font-size:0.9rem;margin-top:0.5rem;">No hi ha cap pla en fase de prealerta, alerta o emergència en aquest moment.</p>
          </div>`;
        return;
      }

      // Agrupar per pla
      const perPla = {};
      plans.forEach(p => {
        const key = p.plaacronim || p.planom;
        if (!perPla[key]) perPla[key] = [];
        perPla[key].push(p);
      });

      // Ordenar per gravetat
      const ordre = { 'EMERGÈNCIA': 0, 'ALERTA': 1, 'PREALERTA': 2 };
      const plaOrdenat = Object.entries(perPla).sort(([, a], [, b]) => {
        const faseA = Math.min(...a.map(p => ordre[p.plafase] ?? 9));
        const faseB = Math.min(...b.map(p => ordre[p.plafase] ?? 9));
        return faseA - faseB;
      });

      let html = `
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;padding:0.5rem 0 1rem;">
          <span style="font-size:0.75rem;color:#999;">Dades del JSON: ${actualitzat}</span>
          <button class="btn-refresh" onclick="carregarPlansPC()">🔄 Actualitza plans PC</button>
        </div>`;

      plaOrdenat.forEach(([nomPla, entrades]) => {
        const fasePitjor = entrades.reduce((prev, cur) =>
          (ordre[cur.plafase] ?? 9) < (ordre[prev.plafase] ?? 9) ? cur : prev
        );
        const cfg = FASE_CONFIG[fasePitjor.plafase] || { color: '#f5f5f5', border: '#ddd', text: '#333', emoji: '⚪' };

        html += `
          <div class="alerta" style="background:${cfg.color};border-color:${cfg.border};margin-bottom:1rem;">
            <div class="alerta-header">
              ${fasePitjor.plaicona ? `<img src="${fasePitjor.plaicona.url}" style="width:40px;height:40px;object-fit:contain;" onerror="this.style.display='none'">` : `<span class="alerta-emoji">${cfg.emoji}</span>`}
              <div>
                <h2 style="color:${cfg.text}">${nomPla}</h2>
                <p>${cfg.emoji} <strong>${fasePitjor.plafase}</strong></p>
              </div>
            </div>`;

        if (entrades.length > 1) {
          html += `<details style="margin-top:0.75rem;"><summary>${entrades.length} avisos actius</summary><div class="details-content">`;
        } else {
          html += `<div style="margin-top:0.75rem;">`;
        }

        entrades.forEach(e => {
          const cfgE = FASE_CONFIG[e.plafase] || cfg;
          html += `
            <div style="background:#fff;border-radius:4px;padding:0.6rem 0.75rem;margin-bottom:0.5rem;border-left:3px solid ${cfgE.border};">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;flex-wrap:wrap;">
                <span style="font-size:0.8rem;font-weight:600;color:${cfgE.text}">${cfgE.emoji} ${e.plafase}</span>
                <span style="font-size:0.75rem;color:#888;">🕐 ${e.fasedatahora || '—'}</span>
              </div>
              ${e.descripcio ? `<p style="margin-top:0.3rem;font-size:0.85rem;color:#555;">${e.descripcio}</p>` : ''}
              ${e.comunicatpdf ? `<a href="${e.comunicatpdf.url}" target="_blank" rel="noopener noreferrer" class="btn-link" style="font-size:0.8rem;padding:4px 10px;margin-top:0.4rem;display:inline-block;">📄 Comunicat CECAT</a>` : ''}
            </div>`;
        });

        if (entrades.length > 1) {
          html += `</div></details>`;
        } else {
          html += `</div>`;
        }
        html += `</div>`;
      });

      cont.innerHTML = html;
    };

    carregarPlansPC();
  </script>
</body>
</html>
