<!DOCTYPE html>
<html lang="ca">
<head>
  <!-- Sentry error monitoring -->
  <script
    src="https://js-de.sentry-cdn.com/e7b9865c80ec5d1d07d39f149d7fb008.min.js"
    crossorigin="anonymous"
  ></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRAE - Risc GRAE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      background: #f5f5f5;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 1rem;
      color: #333;
      font-size: 15px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    /* Navegació */
    .nav-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1rem;
      border-bottom: 2px solid #0082d9;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-tab { white-space: nowrap; flex-shrink: 0; }
    
    .nav-tab {
      padding: 0.75rem 1.5rem;
      background: #e8e8e8;
      border: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-size: 0.95rem;
      color: #555;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-right: 2px;
    }
    
    .nav-tab:hover {
      background: #d0d0d0;
    }
    
    .nav-tab.active {
      background: #0082d9;
      color: white;
    }
    
    .nav-tab .badge {
      background: #e53935;
      color: white;
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-weight: 600;
    }
    
    .section {
      display: none;
    }
    
    .section.active {
      display: block;
    }
    
    /* Loading */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      text-align: center;
      color: #666;
    }
    
    .loading-icon {
      font-size: 3rem;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    /* Error */
    .error {
      background: #fff;
      border: 1px solid #e53935;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      max-width: 400px;
      margin: 4rem auto;
    }
    
    .error h2 { color: #e53935; margin: 1rem 0; }
    
    .error button {
      background: #0082d9;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      color: white;
      cursor: pointer;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    
    /* Header */
    header {
      text-align: center;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: #fff;
      border-radius: 4px;
      border-bottom: 3px solid #0082d9;
    }
    
    .header-icon { font-size: 1.5rem; margin-bottom: 0.25rem; }
    
    h1 {
      font-size: 1.2rem;
      color: #0082d9;
      margin-bottom: 0.25rem;
    }
    
    .data { color: #666; font-size: 0.85rem; }
    .actualitzat { font-size: 0.7rem; color: #999; margin-top: 0.25rem; }
    
    /* Alerta / Card */
    .alerta, .card {
      border-radius: 4px;
      padding: 1rem;
      margin-bottom: 1rem;
      border-width: 1px;
      border-style: solid;
      background: #fff;
    }
    
    .card {
      background: #fff;
      border-color: #ddd;
    }
    
    .alerta-header, .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    
    .alerta-emoji, .card-emoji { font-size: 2rem; }
    .alerta h2, .card h2 { font-size: 1.1rem; }
    .alerta p, .card p { margin-top: 0.25rem; color: #555; font-size: 0.9rem; }
    
    .zones-perill {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid #eee;
      font-size: 0.85rem;
      color: #666;
    }
    
    /* Grups */
    .grup {
      margin-bottom: 1rem;
      background: #fff;
      border-radius: 4px;
      padding: 1rem;
      border: 1px solid #ddd;
    }
    
    .grup-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #eee;
    }
    
    .grup-header h3 {
      font-size: 1.1rem;
      color: #333;
    }
    
    .grup-zones {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 0.75rem;
    }
    
    /* Desplegables */
    details {
      margin-top: 0.5rem;
    }
    
    summary {
      cursor: pointer;
      padding: 0.5rem 0.75rem;
      background: #f0f0f0;
      border-radius: 4px;
      font-weight: 500;
      font-size: 0.85rem;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
      color: #333;
    }
    
    summary::-webkit-details-marker {
      display: none;
    }
    
    summary::before {
      content: "▶";
      font-size: 0.6rem;
      transition: transform 0.2s;
      color: #666;
    }
    
    details[open] summary::before {
      transform: rotate(90deg);
    }
    
    summary:hover {
      background: #e5e5e5;
    }
    
    .details-content {
      padding: 0.75rem;
      margin-top: 0.25rem;
      background: #fafafa;
      border-radius: 4px;
      border: 1px solid #eee;
    }
    
    /* Taules */
    .taula-container {
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    
    th, td {
      padding: 0.5rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    
    th {
      color: #666;
      font-weight: 600;
      font-size: 0.8rem;
      background: #f5f5f5;
    }
    
    /* Problemes */
    .problemes {
      border-radius: 4px;
      padding: 0.75rem;
      background: #fafafa;
      border: 1px solid #eee;
    }
    
    .problema-item {
      margin-bottom: 0.5rem;
    }
    
    .problema-item:last-child {
      margin-bottom: 0;
    }
    
    .problema-nom {
      font-weight: 600;
      margin-bottom: 0.15rem;
      font-size: 0.95rem;
      color: #333;
    }
    
    .problema-desc {
      font-size: 0.85rem;
      color: #666;
      line-height: 1.4;
    }
    
    /* Tendència */
    .tendencia {
      background: #e3f2fd;
      border-radius: 4px;
      padding: 0.75rem;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      border-left: 3px solid #0082d9;
    }
    
    .tendencia strong {
      display: block;
      margin-bottom: 0.25rem;
      color: #0082d9;
    }
    
    /* Colors per nivell de perill */
    .perill-5 { background: #212121; border-color: #212121; color: #fff; }
    .perill-5 h2, .perill-5 h3 { color: #fff; }
    .perill-5 p { color: #ddd; }
    
    .perill-4 { background: #ffebee; border-color: #e53935; }
    .perill-4 h2, .perill-4 h3 { color: #c62828; }
    
    .perill-3 { background: #fff3e0; border-color: #f57c00; }
    .perill-3 h2, .perill-3 h3 { color: #e65100; }
    
    .perill-2 { background: #fffde7; border-color: #fbc02d; }
    .perill-2 h2, .perill-2 h3 { color: #f57f17; }
    
    .perill-1 { background: #e8f5e9; border-color: #43a047; }
    .perill-1 h2, .perill-1 h3 { color: #2e7d32; }
    
    /* Colors SMP */
    .nivell-vermell { background: #ffebee; border-color: #e53935; }
    .nivell-vermell h2 { color: #c62828; }
    
    .nivell-taronja { background: #fff3e0; border-color: #f57c00; }
    .nivell-taronja h2 { color: #e65100; }
    
    .nivell-groc { background: #fffde7; border-color: #fbc02d; }
    .nivell-groc h2 { color: #f57f17; }
    
    /* Footer */
    footer {
      text-align: center;
      margin-top: 1.5rem;
      padding: 1rem;
      border-top: 1px solid #ddd;
    }
    
    .btn-pdf, .btn-link {
      display: inline-block;
      background: #0082d9;
      padding: 8px 16px;
      border-radius: 4px;
      color: #fff;
      text-decoration: none;
      margin-bottom: 0.5rem;
      transition: background 0.2s;
      font-size: 0.9rem;
    }
    
    .btn-pdf:hover, .btn-link:hover {
      background: #006bb3;
    }
    
    .font-info {
      font-size: 0.75rem;
      color: #999;
      margin: 0.5rem 0;
    }
    
    .btn-refresh {
      background: #fff;
      border: 1px solid #ddd;
      padding: 6px 14px;
      border-radius: 4px;
      color: #666;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    
    .btn-refresh:hover {
      background: #f5f5f5;
    }
    
    /* Mapa ICGC */
    .mapa-container {
      margin-bottom: 1rem;
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #ddd;
    }
    
    .mapa-container iframe {
      width: 100%;
      height: 450px;
      border: none;
    }
    
    .mapa-fallback {
      padding: 0.5rem;
      text-align: center;
      font-size: 0.8rem;
      background: #f0f0f0;
      color: #666;
    }
    
    .mapa-fallback a {
      color: #0082d9;
    }
    
    /* BPA Layout compacte */
    .bpa-header-compact {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      border: 1px solid;
      margin-bottom: 1rem;
      background: #fff;
    }
    
    .bpa-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .bpa-header-compact .header-icon {
      font-size: 2rem;
      margin: 0;
    }
    
    .bpa-header-compact h1 {
      font-size: 1.1rem;
      margin-bottom: 0.15rem;
    }
    
    .bpa-header-compact .data {
      font-size: 0.85rem;
    }
    
    .bpa-header-compact .actualitzat {
      margin-top: 0.15rem;
      font-size: 0.7rem;
    }
    
    .bpa-header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-align: right;
    }
    
    .bpa-header-right .alerta-emoji {
      font-size: 1.75rem;
    }
    
    .bpa-header-right h2 {
      font-size: 1rem;
      margin-bottom: 0.1rem;
    }
    
    .bpa-header-right p {
      font-size: 0.8rem;
    }
    
    @media (max-width: 800px) {
      .bpa-header-compact {
        flex-direction: column;
        text-align: center;
      }
      .bpa-header-left, .bpa-header-right {
        justify-content: center;
        text-align: center;
      }
    }
    
    /* BPA Main layout amb mapa lateral */
    .bpa-main {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }
    
    .bpa-grups {
      flex: 1;
    }
    
    .bpa-mapa {
      width: 500px;
      min-width: 300px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #ddd;
      flex-shrink: 0;
    }
    
    .bpa-mapa iframe {
      width: 500px;
      height: 500px;
      border: none;
    }
    
    @media (max-width: 900px) {
      .bpa-main {
        flex-direction: column;
      }
      .bpa-mapa {
        width: 100%;
        min-width: auto;
      }
    }

    /* Previsió específic */
    .previsio-dia {
      margin-bottom: 1rem;
    }
    
    .previsio-dia h3 {
      font-size: 1rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #ddd;
      color: #333;
    }
    
    .previsio-variables {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .variable-card {
      background: #fff;
      border-radius: 4px;
      padding: 0.75rem 1rem;
      border: 1px solid #ddd;
    }
    
    .variable-card h4 {
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
      color: #0082d9;
    }
    
    .variable-card .valor {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #444;
    }
    
    /* SMP específic */
    .avis-card {
      border-radius: 4px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      border: 1px solid;
      background: #fff;
    }
    
    .avis-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    
    .avis-header h3 {
      font-size: 1rem;
      color: #333;
    }
    
    .avis-emoji {
      font-size: 1.5rem;
    }
    
    .avis-dies {
      margin-top: 0.75rem;
    }
    
    .avis-dia {
      background: #f5f5f5;
      border-radius: 4px;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
    }
    
    .avis-dia-header {
      font-weight: 600;
      margin-bottom: 0.25rem;
      font-size: 0.85rem;
      color: #333;
    }
    
    .afectacio {
      font-size: 0.8rem;
      padding: 0.35rem;
      background: #fff;
      border-radius: 4px;
      margin-bottom: 0.25rem;
      border: 1px solid #eee;
      color: #555;
    }
    
    .no-alertes {
      text-align: center;
      padding: 2rem;
      background: #e8f5e9;
      border: 1px solid #43a047;
      border-radius: 4px;
    }
    
    .no-alertes .icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }
    
    .no-alertes h3 {
      color: #2e7d32;
    }
    
    /* Taula SMP */
    .smp-taula {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      background: #fff;
    }
    
    .smp-taula th, .smp-taula td {
      padding: 0.4rem;
      text-align: center;
      border: 1px solid #ddd;
    }
    
    .smp-taula th {
      background: #f5f5f5;
      font-weight: 600;
      color: #333;
    }
    
    .smp-taula .zona-nom {
      text-align: left;
      font-weight: 500;
      white-space: nowrap;
      padding-left: 0.5rem;
      color: #333;
    }
    
    .smp-taula .periode-header {
      font-size: 0.7rem;
      color: #666;
      min-width: 45px;
    }
    
    .smp-taula .cel-alerta {
      font-size: 0.9rem;
      cursor: help;
      padding: 0.25rem;
      vertical-align: middle;
    }
    
    .smp-taula .cel-emoji {
      font-size: 0.9rem;
      line-height: 1;
    }
    
    .smp-taula .cel-info {
      font-size: 0.55rem;
      color: #333;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }
    
    .smp-taula .cel-prob {
      font-size: 0.5rem;
      color: #666;
      line-height: 1;
    }
    
    .smp-taula .cel-ok {
      font-size: 0.7rem;
      color: #999;
    }
    
    @media (max-width: 700px) {
      .smp-taula {
        font-size: 0.7rem;
      }
      .smp-taula .zona-nom {
        max-width: 80px;
        white-space: normal;
        font-size: 0.65rem;
      }
      .smp-taula th, .smp-taula td {
        padding: 0.25rem;
      }
      .smp-taula .periode-header {
        font-size: 0.6rem;
      }
    }
    
    /* Mapes SMP costat */
    .mapes-smp {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    
    .mapa-smp-dia {
      flex: 1;
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #ddd;
    }
    
    .mapa-smp-dia h4 {
      text-align: center;
      padding: 0.5rem;
      background: #f5f5f5;
      margin: 0;
      font-size: 0.85rem;
      color: #333;
    }
    
    @media (max-width: 700px) {
      .mapes-smp {
        flex-direction: column;
      }
    }
    
    /* ========== SECCIÓ RISC ========== */
    .risc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: #fff;
      border-radius: 4px;
      border-bottom: 3px solid #e53935;
    }
    
    .risc-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #e53935;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .risc-actions {
      display: flex;
      gap: 0.5rem;
    }
    
    .risc-btn {
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: #fff;
      color: #333;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    
    .risc-btn:hover {
      background: #f5f5f5;
      border-color: #bbb;
    }
    
    .risc-btn-primary {
      background: #e53935;
      border-color: #e53935;
      color: #fff;
      font-weight: 600;
    }
    
    .risc-btn-primary:hover {
      background: #c62828;
    }
    
    .risc-grid {
      display: grid;
      grid-template-columns: 0.8fr 1.6fr 0.8fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    
    @media (max-width: 900px) {
      .risc-grid {
        grid-template-columns: 1fr;
      }
    }
    
    .risc-card {
      background: #fff;
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid #ddd;
      border-top: 4px solid #999;
    }
    
    .risc-card.yesterday { border-top-color: #999; }
    .risc-card.today { border-top-color: #e53935; }
    .risc-card.tomorrow { border-top-color: #ff9800; }
    
    .risc-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    
    .risc-card-label {
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .risc-card-date {
      font-size: 0.95rem;
      font-weight: 600;
      color: #333;
      margin-top: 0.15rem;
    }
    
    .risc-value {
      text-align: center;
      padding: 1rem 0;
    }
    
    .risc-number {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1;
    }
    
    .risc-card.today .risc-number {
      font-size: 5rem;
    }
    
    .risc-level {
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .risc-bar {
      height: 6px;
      background: #eee;
      border-radius: 3px;
      margin: 0.75rem 0;
      overflow: hidden;
    }
    
    .risc-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    
    .risc-breakdown {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid #eee;
    }
    
    .risc-breakdown-title {
      font-size: 0.65rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }
    
    .risc-breakdown-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
      font-size: 0.8rem;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .risc-breakdown-item:last-child {
      border-bottom: none;
    }
    
    .risc-breakdown-label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: #666;
    }
    
    .risc-breakdown-value {
      font-weight: 600;
      color: #333;
    }
    
    .risc-conditions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    
    .risc-condition-card {
      background: #fff;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      border: 1px solid #ddd;
    }
    
    .risc-condition-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    
    .risc-condition-title {
      font-weight: 600;
      font-size: 0.85rem;
      color: #333;
    }
    
    .risc-status {

  <script>
    // ==================== SUPABASE ====================
    const SUPABASE_URL = 'https://rxfjwklbvqkwgzmpzwae.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4Zmp3a2xidnFrd2d6bXB6d2FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDg2MDIsImV4cCI6MjA5MzU4NDYwMn0.dGtiy1S1Q7mn5mX_cV60KfQQgmOQ5_JIeA7y2SGmdhY';
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function guardarRiscSupabase(dataStr, riscVal, factors, notes) {
      try {
        const { error } = await sbClient
          .from('risc_historic')
          .upsert({
            data: dataStr,
            risc: riscVal,
            planspc: factors.planspc || 0,
            smp: factors.smp || 0,
            allaus: factors.allaus || 0,
            afluencia: factors.afluencia || 0,
            hc: factors.hc || 0,
            canvi: factors.canvi || 0,
            boletaires: factors.boletaires || 0,
            notes: notes || '',
            font: 'web'
          }, { onConflict: 'data' });
        if (error) throw error;
        return { ok: true };
      } catch (e) {
        logError('Supabase', e.message);
        return { ok: false, error: e.message };
      }
    }

    async function carregarDiaSupabase(dataStr) {
      try {
        const { data, error } = await sbClient
          .from('risc_historic')
          .select('*')
          .eq('data', dataStr)
          .single();
        if (error) throw error;
        return data;
      } catch (e) {
        return null;
      }
    }

    // URLs de les fonts de dades
    // ==================== UTILITATS ====================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function fetchAmbTimeout(url, ms = 12000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), ms);
      try {
        return await fetch(url, { signal: controller.signal });
      } catch(e) {
        if (e.name === 'AbortError') throw new Error('Timeout: ' + url.substring(0,60));
        throw e;
      } finally {
        clearTimeout(id);
      }
    }

    // ==================== LOG D'ERRORS ====================
    const LS_ERRORS_KEY = 'grae_error_log';
    const errorLog = (() => { try { return JSON.parse(localStorage.getItem(LS_ERRORS_KEY) || '[]'); } catch { return []; } })();
    function logError(font, missatge, detall) {
      const entrada = {
        ts: new Date().toISOString(),
        font,
        missatge: String(missatge),
        detall: detall ? String(detall) : ''
      };
      errorLog.unshift(entrada);
      if (errorLog.length > 200) errorLog.pop();
      try { localStorage.setItem(LS_ERRORS_KEY, JSON.stringify(errorLog)); } catch {}
      if (typeof sbClient !== 'undefined' && sbClient) {
        sbClient.from('error_log').insert({ ts: entrada.ts, font: entrada.font, missatge: entrada.missatge, detall: entrada.detall || null }).then(() => {});
      }
      const badge = document.getElementById('badge-errors');
      if (badge) {
        badge.textContent = errorLog.filter(e => {
          const d = new Date(e.ts);
          return (Date.now() - d.getTime()) < 86400000; // últimes 24h
        }).length;
        badge.style.display = 'inline-block';
      }
      console.error('[' + font + ']', missatge, detall || '');
    }

    const _base = location.protocol === 'file:'
      ? 'https://correvents.github.io/Risc-Grae-v1'
      : '.';
    const URLS = {
      bpa:     _base + "/data/bpa_latest.json",
      previsio: _base + "/data/previsio_latest.json",
      smp:     _base + "/data/smp_latest.json",
      planspc: _base + "/data/planspc_latest.json"
    };
    
    // Navegació
    let bpaIframeLoaded = false;
    
    // Variables globals per guardar dades carregades (per calcular risc)
    let dadesCarregades = {
      bpa: null,
      smp: null,
      previsio: null,
      planspc: null
    };
    
    // ==================== NAVEGACIÓ ====================
    function mostrarSeccio(ev, seccio) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('seccio-' + seccio).classList.add('active');
      ev.currentTarget.classList.add('active');
      
      if (seccio === 'helicopters') carregarHelicopters();
      if (seccio === 'canvitemps') carregarCanviTemps();

      // Carregar iframe BPA quan es mostra la secció per primer cop
      if (seccio === 'bpa' && !bpaIframeLoaded) {
        setTimeout(() => {
          const iframeContainer = document.querySelector('.bpa-mapa');
          if (iframeContainer) {
            iframeContainer.innerHTML = '<iframe src="https://bpa.icgc.cat/" title="Mapa de perill d\'allaus" width="500" height="500"></iframe>';
            bpaIframeLoaded = true;
          }
        }, 100);
      }
    }
    
    // ==================== BPA ====================
    const getPerillEmoji = (nivell) => {
      const emojis = { 5: "⚫", 4: "🔴", 3: "🟠", 2: "🟡", 1: "🟢" };
      return emojis[nivell] || "⚪";
    };
    
    const getPerillNom = (nivell) => {
      const noms = { 5: "MOLT FORT", 4: "FORT", 3: "MARCAT", 2: "MODERAT", 1: "FEBLE" };
      return noms[nivell] || "Desconegut";
    };

    const renderBPA = (bpa) => {
      // Actualitzar badge
      if (bpa.resum && bpa.resum.perill_maxim_numeric >= 3) {
        const badge = document.getElementById('badge-bpa');
        badge.textContent = bpa.resum.perill_maxim_numeric;
        badge.style.display = 'inline';
      }
      
      // Zones ordenades de major a menor perill, agrupant les que tenen problemes idèntics
      const zonesOrd = [...bpa.zones].sort((a, b) => (b.perill_numeric || 0) - (a.perill_numeric || 0));
      const _grpMap = new Map();
      const zonesAgrup = [];
      zonesOrd.forEach(zona => {
        const probs = zona.problems || [];
        const p1 = probs.find(p => p.priority == '1');
        const p2 = probs.find(p => p.priority == '2');
        const key = [
          zona.perill_numeric || 0,
          p1 ? `${p1.id_tipus_situacio}|${p1.origen}|${p1.mida}|${p1.tendencia}` : '',
          p2 ? `${p2.id_tipus_situacio}|${p2.origen}|${p2.mida}|${p2.tendencia}` : '',
        ].join('::');
        if (_grpMap.has(key)) {
          _grpMap.get(key).noms.push(zona.nom);
        } else {
          const g = { zona, noms: [zona.nom] };
          _grpMap.set(key, g);
          zonesAgrup.push(g);
        }
      });

      const ORIGEN  = { '1':'Natural', '2':'Accidental', '3':'Natural i accidental' };
      const MIDA    = { '1':'Petita (D1)', '2':'Mitjana (D2)', '3':'Gran (D3)', '4':'Molt gran (D4)', '5':'Extrema (D5)' };
      const TEND_IC = { '1':'↘ Decreixent', '2':'→ Estacionari', '3':'↗ Creixent' };
      const TEND_COLOR = { '1':'#c62828', '2':'#555', '3':'#1565c0' };
      const ICGC_IMG = 'https://bpa.icgc.cat/img/level2/';
      const DISTRIB_BASE = 'https://bpa.icgc.cat/butlletigenerator/assets/';

      const pic = (type, code) => code
        ? `<img src="${ICGC_IMG}${type}${code}.png" style="height:32px;vertical-align:middle;" title="${
            type==='origen'?ORIGEN[code]:type==='mida'?MIDA[code]:type==='tendencia'?TEND_IC[code]:''
          }" onerror="this.style.display='none'">`
        : '';

      const renderProblem = (prob, zona, etiqueta, colorBorde) => {
        if (!prob) return `<div style="flex:1;padding:0.5rem 0.6rem;background:#f9f9f9;border-radius:6px;border-top:3px solid #ddd;color:#aaa;font-size:0.75rem;text-align:center;">Sense ${etiqueta.toLowerCase()}</div>`;
        const origen  = ORIGEN[prob.origen]    || '—';
        const mida    = MIDA[prob.mida]        || '—';
        const tend    = TEND_IC[prob.tendencia] || '—';
        const tendCol = TEND_COLOR[prob.tendencia] || '#555';
        const distribImg = (zona.id_zona && prob.id_tipus_situacio)
          ? `<img src="${DISTRIB_BASE}Distribucio_${bpa.data}_Zona_${zona.id_zona}_Situacio_${prob.id_tipus_situacio}.png"
               style="height:56px;border-radius:4px;margin-bottom:0.4rem;" onerror="this.style.display='none'">`
          : '';
        return `
          <div style="flex:1;padding:0.5rem 0.6rem;background:#f8f8f8;border-radius:6px;border-top:3px solid ${colorBorde};">
            <div style="font-size:0.65rem;font-weight:700;color:#546e7a;text-transform:uppercase;margin-bottom:0.35rem;">${etiqueta}</div>
            ${distribImg}
            <div style="display:flex;align-items:center;gap:0.4rem;margin-bottom:0.4rem;">
              ${pic('situacio', prob.id_tipus_situacio)}
              <span style="font-weight:600;font-size:0.8rem;">${prob.tipus_situacio || '—'}</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:0.25rem;">
              <div style="display:flex;align-items:center;gap:0.3rem;font-size:0.7rem;color:#444;">
                ${pic('origen', prob.origen)}<span>Origen: <strong>${origen}</strong></span>
              </div>
              <div style="display:flex;align-items:center;gap:0.3rem;font-size:0.7rem;color:#444;">
                ${pic('mida', prob.mida)}<span>Mida: <strong>${mida}</strong></span>
              </div>
              <div style="display:flex;align-items:center;gap:0.3rem;font-size:0.7rem;color:${tendCol};">
                ${pic('tendencia', prob.tendencia)}<span>Tendència: <strong>${tend}</strong></span>
              </div>
            </div>
          </div>`;
      };

      const zonesHtml = zonesAgrup.map(({ zona, noms }) => {
        const nivellNum = zona.perill_numeric || 0;
        const nomNivell = getPerillNom(nivellNum);
        const emoji = getPerillEmoji(nivellNum);
        const cota = zona.cota_critica?.trim() || '';
        const probs = zona.problems || [];
        const primari   = probs.find(p => p.priority == '1') || null;
        const secundari = probs.find(p => p.priority == '2') || null;
        const nomPrimari   = primari?.tipus_situacio   || zona.situacio_primaria?.trim()   || '';
        const nomSecundari = secundari?.tipus_situacio || zona.situacio_secundaria?.trim() || '';
        const distribucio  = (zona.text_distribucio || zona.distribucio_mantell || '').trim();
        const tendencia    = (zona.text_tendencia   || zona.tendencia || '').trim();
        const estatMantell = (zona.text_estat_mantell || '').trim();

        const detall = (icona, titol, text, bgColor) => text ? `
            <details style="border-top:1px solid #eee;">
              <summary style="padding:0.4rem 0.75rem;background:${bgColor};cursor:pointer;font-size:0.7rem;font-weight:700;color:#444;text-transform:uppercase;list-style:none;display:flex;align-items:center;gap:0.3rem;">
                <span style="font-size:0.75rem;">▶</span> ${icona} ${titol}
              </summary>
              <div style="padding:0.5rem 0.75rem;font-size:0.75rem;color:#333;line-height:1.5;background:#fff;">${text}</div>
            </details>` : '';

        const colPrincipal = primari
          ? renderProblem(primari, zona, 'Perill principal', '#e53935')
          : (nomPrimari ? `<div style="flex:1;padding:0.5rem;background:#f8f8f8;border-radius:6px;border-top:3px solid #e53935;font-size:0.8rem;">Principal: ${nomPrimari}</div>` : renderProblem(null, zona, 'Perill principal', '#ddd'));
        const colSecundari = secundari
          ? renderProblem(secundari, zona, 'Perill secundari', '#fb8c00')
          : (nomSecundari ? `<div style="flex:1;padding:0.5rem;background:#f8f8f8;border-radius:6px;border-top:3px solid #fb8c00;font-size:0.8rem;">Secundari: ${nomSecundari}</div>` : renderProblem(null, zona, 'Perill secundari', '#ddd'));

        return `
          <div style="border:1px solid #ddd;border-radius:8px;overflow:hidden;margin-bottom:0.75rem;">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0.75rem;background:#f5f5f5;border-bottom:1px solid #e0e0e0;">
              <strong style="font-size:0.9rem;">${emoji} ${noms.join(' · ')}</strong>
              <div style="display:flex;align-items:center;gap:0.5rem;">
                ${cota ? `<span style="font-size:0.68rem;color:#666;">Cota: ${cota}</span>` : ''}
                <span style="font-size:0.7rem;font-weight:700;padding:0.15rem 0.45rem;border-radius:3px;background:${['','#43a047','#fdd835','#ef6c00','#e53935','#7b1fa2'][nivellNum]||'#333'};color:${nivellNum==2?'#333':'#fff'};">${nomNivell} (${nivellNum})</span>
              </div>
            </div>
            <div style="display:flex;gap:0.5rem;padding:0.6rem;">
              ${colPrincipal}
              ${colSecundari}

    // ==================== SMP ====================
    const getSMPEmoji = (meteor) => {

        'Onatge': '🌊', 'Fred': '🥶', 'Calor': '🥵', 'Allaus': '🏔️'
      };
      return emojis[meteor] || '⚠️';
    };
    
    const getNivellColor = (nivell) => {
      const colors = { 'Vermell': '#ef4444', 'Taronja': '#f97316', 'Groc': '#facc15' };
      return colors[nivell] || '#22c55e';
    };
    
    const getNivellBg = (nivell) => {
      const colors = { 'Vermell': 'rgba(239,68,68,0.8)', 'Taronja': 'rgba(249,115,22,0.8)', 'Groc': 'rgba(250,204,21,0.8)' };
      return colors[nivell] || 'rgba(34,197,94,0.3)';
    };
    
    // Agrupació de zones
    const ZONES_GRUPS = {
      'Pirineu Occidental': ['Pirineu Occidental', 'Pirineu Central'],
      'Pirineu Oriental': ['Pirineu Oriental', 'Prepirineu'],
      'Costa Brava': ['Costa Brava', 'Litoral Nord'],
      'Litoral Central': ['Litoral Central', 'Vallès', 'Penedès'],
      'Plana de Lleida': ['Plana de Lleida', 'Catalunya Central'],
      'Camp de Tarragona': ['Camp de Tarragona', 'Serres de Prades i Montsant'],
      "Terres de l'Ebre": ["Terres de l'Ebre"]
    };
    
    const ZONES_ORDRE = [
      'Pirineu Occidental', 'Pirineu Oriental', 'Costa Brava', 
      'Litoral Central', 'Plana de Lleida', 'Camp de Tarragona', "Terres de l'Ebre"
    ];
    
    // Mapeig invers: zona original -> grup
    const zonaToGrup = {};
    Object.entries(ZONES_GRUPS).forEach(([grup, zones]) => {
      zones.forEach(z => zonaToGrup[z] = grup);
    });
    
    // Convertir m/s a km/h i formatar llindar
    const formatLlindar = (llindar) => {
      if (!llindar) return '';
      // Convertir m/s a km/h
      const match = llindar.match(/>\s*(\d+)\s*m\/s/);
      if (match) {
        const ms = parseInt(match[1]);
        const kmh = Math.round(ms * 3.6);
        return llindar.replace(/>\s*\d+\s*m\/s/, `> ${kmh} km/h`);
      }
      return llindar;
    };

    const formatProb = (prob) => {
      const abrev = {
        'Poc probable': 'Poc prob.',
        'Probable': 'Prob.',
        'Molt probable': 'Molt prob.',
        'Segur': 'Segur'
      };
      return abrev[prob] || prob;
    };
    
    const renderSMP = (data) => {

        const matriu = {};
        
        data.avisos.forEach(avis => {
          const meteor = avis.meteor;
          const emoji = getSMPEmoji(meteor);
          
          avis.dies?.forEach(dia => {
            const diaKey = dia.dia;
            if (diaKey !== avui && diaKey !== dema) return; // Només avui i demà
            
            dia.afectacions?.forEach(af => {
              const zonaOriginal = af.zona;
              const zona = zonaToGrup[zonaOriginal] || zonaOriginal; // Usar grup
              if (!matriu[zona]) matriu[zona] = {};
              if (!matriu[zona][diaKey]) matriu[zona][diaKey] = {};
              
              af.periodes?.forEach(p => {
                const key = p;
                const ordre = { 'Vermell': 3, 'Taronja': 2, 'Groc': 1 };
                const nivellNou = af.nivell;

                if (!matriu[zona][diaKey][key]) {
                  matriu[zona][diaKey][key] = { nivell: nivellNou, riscos: [] };
                }

                // Afegir risc si no hi és ja per aquest meteor
                const jaExisteix = matriu[zona][diaKey][key].riscos.find(r => r.meteor === meteor);
                if (!jaExisteix) {
                  matriu[zona][diaKey][key].riscos.push({
                    meteor, emoji, nivell: nivellNou,
                    llindar: af.llindar, probabilitat: af.probabilitat
                  });
                }

                // Actualitzar nivell màxim
                if (ordre[nivellNou] > ordre[matriu[zona][diaKey][key].nivell]) {
                  matriu[zona][diaKey][key].nivell = nivellNou;
                }
              });
            });
          });
        });
        
        // Usar zones definides (només les que tenen dades)
        const zonesActives = ZONES_ORDRE.filter(z => matriu[z]);
        
        // Format dia
        const formatDia = (d) => {
          const date = new Date(d + 'T12:00:00');

        html += `

                const riscPrincipal = riscosOrdenats[0];
                const tooltip = riscosOrdenats.map(r => {
                  const llindar = formatLlindar(r.llindar);

                }).join(' | ');
                html += `<td class="cel-alerta" style="background: ${getNivellBg(cel.nivell)}; vertical-align: top; padding: 0;" title="${tooltip}">`;
                riscosOrdenats.forEach((r, idx) => {
                  const llindarKmh = formatLlindar(r.llindar);
                  const prob = formatProb(r.probabilitat);
                  const bgColor = idx === 0 ? getNivellBg(cel.nivell) : getNivellBg(r.nivell);
                  const border = idx > 0 ? 'border-top: 1px solid rgba(0,0,0,0.15);' : '';

          html += '</tr>';
        });
        
        html += `
              </tbody>

            <span>🌊 Onatge</span>
          </div>
        `;
        
        // Comentaris dels avisos (amb zones i hores)
        const comentarisDetall = {};
        data.avisos.forEach(avis => {
          if (avis.comentari) {
            const meteor = avis.meteor;
            if (!comentarisDetall[meteor]) {
              comentarisDetall[meteor] = [];
            }
            
            // Recollir zones i períodes per aquest comentari
            const zonesPerDia = {};
            avis.dies?.forEach(dia => {
              const diaKey = dia.dia;
              if (diaKey !== avui && diaKey !== dema) return;
              
              const diaLabel = diaKey === avui ? 'Avui' : 'Demà';
              if (!zonesPerDia[diaLabel]) zonesPerDia[diaLabel] = {};
              
              dia.afectacions?.forEach(af => {
                const zona = af.zona;

                af.periodes?.forEach(p => zonesPerDia[diaLabel][zona].add(p));
              });

    // Calcular Setmana Santa (algorisme de Butcher) - DEFINIR ABANS D'USAR
    const calcularSetmanaSanta = (any) => {
      const a = any % 19;
      const b = Math.floor(any / 100);
      const c = any % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const mes = Math.floor((h + l - 7 * m + 114) / 31);
      const dia = ((h + l - 7 * m + 114) % 31) + 1;
      
      // Diumenge de Pasqua
      const pasqua = new Date(any, mes - 1, dia);
      
      // Divendres Sant (2 dies abans)
      const divendresSant = new Date(pasqua);
      divendresSant.setDate(pasqua.getDate() - 2);
      
      // Dilluns de Pasqua (1 dia després)
      const dillunsPasqua = new Date(pasqua);
      dillunsPasqua.setDate(pasqua.getDate() + 1);
      
      return {
        pasqua: pasqua,
        divendresSant: divendresSant,
        dillunsPasqua: dillunsPasqua
      };
    };

        // Cap de setmana anterior a Setmana Santa (nivell 2)
        { inici: formatDateStr(dsAnterior), fi: formatDateStr(dgAnterior), motiu: "Cap setmana anterior Setmana Santa" },

        // Divendres Sant a Dilluns Pasqua (nivell 2)

        { inici: `${any}-08-01`, fi: `${any}-08-15`, motiu: "1a quinzena d'agost" },
        { inici: `${any}-12-05`, fi: `${any}-12-08`, motiu: "Pont Puríssima" }
      ];
      
      // Dilluns i Dimarts de Setmana Santa (nivell 1)
      const periodes1Extra = [
        { inici: formatDateStr(dlSS), fi: formatDateStr(dtSS), motiu: "Setmana Santa (dilluns-dimarts)" }
      ];
      
      // Pont 1 de Maig
      const dia1maig = new Date(any, 4, 1).getDay();
      if (dia1maig === 5) { // Divendres
        periodes2.push({ inici: `${any}-05-01`, fi: `${any}-05-03`, motiu: "Pont 1 de Maig" });
      } else if (dia1maig === 4) { // Dijous
        periodes2.push({ inici: `${any}-05-01`, fi: `${any}-05-04`, motiu: "Pont 1 de Maig" });
      }
      
      // Temporada estiu-tardor - caps de setmana nivell 2
      // Juliol, Agost, Setembre i 1a quinzena Octubre
      let dataEstiu = new Date(any, 6, 1); // 1 juliol
      const fiEstiu = new Date(any, 9, 15); // 15 octubre

        if (dataEstiu.getDay() === 6) { // Dissabte

          diumenge.setDate(diumenge.getDate() + 1);
          let motiu = "Cap de setmana estiu";
          if (dataEstiu.getMonth() === 8 || dataEstiu.getMonth() === 9) {
            motiu = "Temporada tardor (bolets)";
          }
          periodes2.push({ 
            inici: formatDateStr(dataEstiu), 
            fi: formatDateStr(diumenge), 
            motiu: motiu 
          });
        }
        dataEstiu.setDate(dataEstiu.getDate() + 1);
      }

        ],

    const detectarPonts = (festius) => {
      const ponts = [];
      
      festius.forEach(f => {
        const [any, mes, dia] = f.data.split('-').map(Number);
        const data = new Date(any, mes - 1, dia);
        const diaSemana = data.getDay(); // 0=dg, 1=dl, ..., 6=ds
        
        // Festiu en dijous -> pont divendres
        if (diaSemana === 4) {
          const pont = new Date(data);
          pont.setDate(pont.getDate() + 1);
          ponts.push({
            data: formatDateStr(pont),
            nom: `Pont ${f.nom}`,
            nivell: 2,
            auto: true
          });

        if (diaSemana === 2) {
          const pont = new Date(data);
          pont.setDate(pont.getDate() - 1);
          ponts.push({
            data: formatDateStr(pont),
            nom: `Pont ${f.nom}`,
            nivell: 2,
            auto: true
          });

        if (diaSemana === 5) {

            data: f.data,
            nom: `Cap de setmana llarg ${f.nom}`,
            nivell: 2,
            auto: true,
            override: true
          });
        }

        if (diaSemana === 1) {

            data: f.data,
            nom: `Cap de setmana llarg ${f.nom}`,
            nivell: 2,
            auto: true,
            override: true
          });
        }

      normalitzador: 1,  // Dividir punts totals per aquest valor per obtenir 0-6

    function crearRiscDiaDefault(data) {
      // Obtenir nivell afluència del calendari (0-3)
      const infoAflu = getInfoDia(data);
      const afluencia3 = Math.min(3, Math.max(0, infoAflu.nivell || 0));

      return {
        data: data,
        planspc: 0,    // 0-3: 0=cap, 1=prealerta, 2=alerta, 3=emergència
        smp: 0,        // 0-6
        allaus: 0,     // 0-5
        afluencia: afluencia3, // 0-3
        hc: 0,         // 0-2
        canvi: 0,      // 0-2
        notes: '',
        modificat: null
      };
    }
    
    function getRiscDateString(offset = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function localDateStr(offset = 0) {
      return getRiscDateString(offset);
    }
    
    function formatRiscDate(dateStr) {
      const d = new Date(dateStr);
      const dies = ['Dg', 'Dl', 'Dt', 'Dc', 'Dj', 'Dv', 'Ds'];
      const mesos = ['gen', 'feb', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'des'];
      return `${dies[d.getDay()]} ${d.getDate()} ${mesos[d.getMonth()]}`;
    }
    
    // Funció per calcular SMP: compta zones de muntanya afectades per nivell màxim
    function calcularSMPPonderat(data_str) {
      if (!dadesCarregades.smp || !dadesCarregades.smp.avisos) {
        return { valor: 0, explicacio: 'Sense dades', zones: { groc: 0, taronja: 0, vermell: 0 }, detall: [] };
      }

      const nivellOrdre = { 'Groc': 1, 'Taronja': 2, 'Vermell': 3 };
      const infoPerZona = {}; // zonaGrup → { nivell màxim, meteors Set }

      for (const avis of dadesCarregades.smp.avisos) {
        const meteor = avis.meteor || '';
        for (const dia of (avis.dies || [])) {
          if (dia.dia !== data_str) continue;
          for (const afectacio of (dia.afectacions || [])) {
            const zonaOriginal = afectacio.zona || '';
            const nivell = afectacio.nivell || '';
            const zonaGrup = riscParams.zonesGrup[zonaOriginal] || zonaOriginal;
            if (!((riscParams.zones[zonaGrup] ?? -1) > 0)) continue;
            if (!nivellOrdre[nivell]) continue;

            if (!infoPerZona[zonaGrup]) {
              infoPerZona[zonaGrup] = { nivell, meteors: new Set([meteor]) };
            } else {
              if (nivellOrdre[nivell] > nivellOrdre[infoPerZona[zonaGrup].nivell]) {
                infoPerZona[zonaGrup].nivell = nivell;
              }
              infoPerZona[zonaGrup].meteors.add(meteor);
            }
          }
        }
      }

      const zonesPerNivell = { 'Groc': [], 'Taronja': [], 'Vermell': [] };
      const detall = [];
      for (const [zona, info] of Object.entries(infoPerZona)) {
        zonesPerNivell[info.nivell].push(zona);
        detall.push({ zona, nivell: info.nivell, meteors: [...info.meteors] });
      }

      const numGroc    = zonesPerNivell['Groc'].length;
      const numTaronja = zonesPerNivell['Taronja'].length;
      const numVermell = zonesPerNivell['Vermell'].length;

      let valor = 0, explicacio = 'Cap alerta';
      if      (numVermell >= 3) { valor = 6; explicacio = `${numVermell} zones vermell (≥3)`; }
      else if (numVermell >  0) { valor = 5; explicacio = `${numVermell} zona vermell (<3)`;  }
      else if (numTaronja >= 3) { valor = 4; explicacio = `${numTaronja} zones taronja (≥3)`; }
      else if (numTaronja >  0) { valor = 3; explicacio = `${numTaronja} zona taronja (<3)`;  }
      else if (numGroc    >= 3) { valor = 2; explicacio = `${numGroc} zones groc (≥3)`;       }
      else if (numGroc    >  0) { valor = 1; explicacio = `${numGroc} zona groc (<3)`;        }

      return { valor, explicacio, zones: { groc: numGroc, taronja: numTaronja, vermell: numVermell }, detall };
    }
    
    // Funció per calcular valors automàtics des de les dades carregades
    function calcularValorsAuto(data) {
      const resultat = {
        smp: 0,
        smpDetall: [],
        allaus: 0,
        hc: 0,
        canvi: 0,
        notes: []
      };
      
      // 1. ALERTES SMP - rang 0-6
      const smpCalc = calcularSMPPonderat(data);
      resultat.smp = smpCalc.valor;
      resultat.smpDetall = smpCalc.detall;
      if (smpCalc.valor > 0) {
        resultat.notes.push(`SMP: ${smpCalc.explicacio}`);
      }
      
      // 2. RISC ALLAUS (BPA) - valor màxim del dia directe (1-5)
      if (dadesCarregades.bpa && dadesCarregades.bpa.resum) {
        const perillMax = dadesCarregades.bpa.resum.perill_maxim_numeric || 1;
        resultat.allaus = perillMax;
        if (perillMax >= 3) {
          resultat.notes.push(`BPA: perill ${perillMax}/5`);
        }
      }
      
      // 3. DIFICULTAT VOL HC - rang 0-2
      // 0=vola, 1=limitació, 2=no vola
      if (dadesCarregades.smp && dadesCarregades.smp.avisos) {
        dadesCarregades.smp.avisos.forEach(avis => {
          avis.dies?.forEach(dia => {
            if (dia.dia === data) {
              const meteor = avis.meteor?.toLowerCase() || '';
              if ((meteor.includes('vent') || meteor.includes('neu')) && avis.nivell === 'Vermell') {
                resultat.hc = Math.max(resultat.hc, 2);
              } else if ((meteor.includes('vent') || meteor.includes('neu') || meteor.includes('pluja')) && avis.nivell === 'Taronja') {
                resultat.hc = Math.max(resultat.hc, 1);
              } else if ((meteor.includes('vent') || meteor.includes('neu')) && avis.nivell === 'Groc') {
                resultat.hc = Math.max(resultat.hc, 1);
              }
            }
          });
        });
        if (resultat.hc > 0) {
          resultat.notes.push(`HC: dificultat ${resultat.hc}/2`);
        }
      }
      
      // 4. CANVI DE TEMPS - rang 0-2 (pendent implementar)

      // 5. PLANS PC - rang 0-3 (0=cap, 1=prealerta, 2=alerta, 3=emergència)
      if (dadesCarregades.planspc && dadesCarregades.planspc.plans) {
        const ordre = { 'EMERGÈNCIA': 3, 'ALERTA': 2, 'PREALERTA': 1 };
        let maxPla = 0;
        dadesCarregades.planspc.plans.forEach(p => {
          const val = ordre[(p.plafase || '').toUpperCase()] || 0;
          if (val > maxPla) maxPla = val;
        });
        resultat.planspc = maxPla;
        if (maxPla > 0) {
          const labels = { 1: 'Prealerta', 2: 'Alerta', 3: 'Emergència' };
          resultat.notes.push(`Plans PC: ${labels[maxPla]}`);
        }
      }
      
      return resultat;
    }
    
    // Funció per actualitzar risc automàticament quan es carreguen dades
    function actualitzarRiscAuto() {
      if (!riscState.today && !riscState.tomorrow) return;
      
      const avui = getRiscDateString(0);
      const dema = getRiscDateString(1);
      
      // Actualitzar avui
      if (riscState.today && !riscState.today.modificatManualment) {
        const valsAvui = calcularValorsAuto(avui);
        riscState.today.smp = valsAvui.smp;
        riscState.today.allaus = valsAvui.allaus;
        riscState.today.hc = valsAvui.hc;
        riscState.today.canvi = valsAvui.canvi;
        riscState.today.planspc = valsAvui.planspc || 0;
        if (valsAvui.notes.length > 0 && !riscState.today.notes) {
          riscState.today.notes = valsAvui.notes.join('. ');
        }
      }
      
      // Actualitzar demà
      if (riscState.tomorrow && !riscState.tomorrow.modificatManualment) {
        const valsDema = calcularValorsAuto(dema);
        riscState.tomorrow.smp = valsDema.smp;
        riscState.tomorrow.allaus = valsDema.allaus;
        riscState.tomorrow.hc = valsDema.hc;
        riscState.tomorrow.canvi = valsDema.canvi;
        riscState.tomorrow.planspc = valsDema.planspc || 0;
        if (valsDema.notes.length > 0 && !riscState.tomorrow.notes) {
          riscState.tomorrow.notes = valsDema.notes.join('. ');
        }
      }
      
      // Guardar i renderitzar
      localStorage.setItem('riscGRAE', JSON.stringify(riscState));
      renderRisc();
    }
    
    function calcularRisc(dia) {
      // Rangs: planspc 0-3, smp 0-6, allaus 0-5, afluencia 0-3, hc 0-2, canvi 0-2
      // Total màxim teòric: 3+6+5+3+2+2 = 21, normalitzem a 0-6
      const total = parseFloat(dia.planspc||0) + parseFloat(dia.smp||0) + parseFloat(dia.allaus||0) +
                    parseFloat(dia.afluencia||0) + parseFloat(dia.hc||0) + parseFloat(dia.canvi||0);
      return Math.min(6, Math.round((total / 21) * 6));
    }
    
    function getRiscLabel(risc) {
      if (risc <= 1.5) return 'BAIX';
      if (risc <= 3) return 'MODERAT';
      if (risc <= 4.5) return 'ALT';
      return 'MOLT ALT';
    }
    
    function getRiscColorClass(risc) {
      return 'risc-color-' + Math.min(6, Math.floor(risc));
    }
    
    function getRiscBgClass(risc) {
      return 'risc-bg-' + Math.min(6, Math.floor(risc));
    }
    
    function getPlanspcLabel(val) {
      if (val == 0) return 'Cap pla activat';
      if (val == 1) return 'Prealerta';
      if (val == 2) return 'Alerta';
      return 'Emergència';
    }

    function getAfluenciaLabel(val) {
      if (val == 0) return 'Normal';
      if (val == 1) return 'Moderat';
      if (val == 2) return 'Alt';
      return 'Molt alt';
    }
    
    function getHCLabel(val) {
      if (val == 0) return 'Vol normal';
      if (val == 1) return 'Dificultats';
      return 'Molt difícil';
    }
    
    function getSMPLabelRisc(val) {
      if (val == 0) return 'Cap alerta';
      if (val <= 2) return 'Avís groc';
      if (val <= 4) return 'Alerta taronja';
      return 'Alerta vermella';
    }
    
    function getCanviLabel(val) {
      if (val == 0) return 'Estable tot el dia';
      if (val == 1) return 'Canvi a partir tarda/migdia';
      return 'Canvi a partir matí';

    function getAllausLabel(val) {
      if (val == 1) return 'Feble';
      if (val == 2) return 'Moderat';
      if (val == 3) return 'Marcat';
      if (val == 4) return 'Fort';
      if (val == 5) return 'Molt fort';
      return '—';
    }

    // ==================== SMP HISTÒRIC ====================
    let smpHistoricMes = null;  // 'YYYY-MM' del mes mostrat
    let smpHistoricMesos = [];  // llista de 'YYYY-MM' amb dades, ordre desc

    function _nextMonth(mesStr) {
      const [y, m] = mesStr.split('-').map(Number);
      return m === 12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,'0')}`;
    }

    async function carregarSMPHistoric() {
      const el = document.getElementById('smp-historic-taula');
      if (!el) return;
      el.innerHTML = '<span style="color:#999;font-style:italic;">Carregant índex de mesos...</span>';
      smpHistoricMesos = [];
      smpHistoricMes = null;

      try {
        // Obtenir tots els timestamps únics: 3 lots de 1000 files (camp lleuger)
        const [r0, r1, r2] = await Promise.all([
          sbClient.from('smp_historic').select('data_consulta').order('data_consulta', { ascending: false }).range(0, 999),
          sbClient.from('smp_historic').select('data_consulta').order('data_consulta', { ascending: false }).range(1000, 1999),
          sbClient.from('smp_historic').select('data_consulta').order('data_consulta', { ascending: false }).range(2000, 2999),
        ]);
        const totes = [...(r0.data||[]), ...(r1.data||[]), ...(r2.data||[])];
        if (!totes.length) { el.innerHTML = '<span style="color:#999;">Sense dades.</span>'; return; }

        // Extreure mesos únics (YYYY-MM) de tots els timestamps
        const mesoSet = new Set();
        for (const r of totes) mesoSet.add(r.data_consulta.substring(0, 7));
        smpHistoricMesos = [...mesoSet].sort().reverse(); // desc: primer el més recent
        smpHistoricMes = smpHistoricMesos[0];

        await smpHistoricCarregarMes();
      } catch(e) {
        el.innerHTML = `<span style="color:#c62828;">Error: ${e.message || e}</span>`;
      }
    }

    async function smpHistoricCarregarMes() {
      const el = document.getElementById('smp-historic-taula');
      const pagEl = document.getElementById('smp-historic-pag');
      const mesNoms = ['Gener','Febrer','Març','Abril','Maig','Juny','Juliol','Agost','Setembre','Octubre','Novembre','Desembre'];
      if (!el || !smpHistoricMes) return;

      el.innerHTML = '<span style="color:#999;font-style:italic;">Carregant...</span>';

      // Actualitzar indicador de mes
      if (pagEl) {
        const [y, m] = smpHistoricMes.split('-').map(Number);
        const idxActual = smpHistoricMesos.indexOf(smpHistoricMes);
        const total = smpHistoricMesos.length;
        pagEl.textContent = `${mesNoms[m-1]} ${y} (${total - idxActual}/${total})`;
      }

      try {
        const mesIni = smpHistoricMes + '-01';
        const mesFi  = _nextMonth(smpHistoricMes) + '-01';

        const [{ data, error }, { data: overrides }] = await Promise.all([
          sbClient
            .from('smp_historic')
            .select('data_consulta,dia,zona,nivell,meteor,llindar,periodes,probabilitat')
            .gte('data_consulta', mesIni)
            .lt('data_consulta', mesFi)
            .order('data_consulta', { ascending: false }),
          sbClient
            .from('smp_override_historic')
            .select('data_hora,valor_smp,motiu')
            .gte('data_hora', mesIni)
            .lt('data_hora', mesFi)
            .order('data_hora', { ascending: false }),
        ]);
        if (error) throw error;

        // Agrupar per timestamp de consulta
        const grups = {};
        for (const r of (data||[])) {
          if (!grups[r.data_consulta]) grups[r.data_consulta] = [];
          grups[r.data_consulta].push(r);
        }
        const diesMes = Object.keys(grups).sort().reverse();

        if (!diesMes.length) {
          el.innerHTML = '<span style="color:#999;">Sense dades per aquest mes.</span>';
          return;
        }

        // Agrupar overrides per dia (YYYY-MM-DD)
        const overridePerDia = {};
        for (const ov of (overrides||[])) {
          const dia = ov.data_hora.substring(0, 10);
          if (!overridePerDia[dia]) overridePerDia[dia] = [];
          overridePerDia[dia].push(ov);
        }

        // Actualitzar el comptador amb els dies reals del mes
        if (pagEl) {
          const [y, m] = smpHistoricMes.split('-').map(Number);
          pagEl.textContent = `${mesNoms[m-1]} ${y} · ${diesMes.length} dies`;
        }

        smpHistoricRenderTaula(diesMes, grups, overridePerDia);
      } catch(e) {
        el.innerHTML = `<span style="color:#c62828;">Error: ${e.message || e}</span>`;
      }
    }

    function smpHistoricRenderTaula(diesPagina, grups, overridePerDia = {}) {
      const el = document.getElementById('smp-historic-taula');
      if (!el) return;

      const nivellColor = { 'Groc':'#f57f17','Taronja':'#e65100','Vermell':'#c62828' };
      const nivellBg    = { 'Groc':'#fffde7','Taronja':'#fff3e0','Vermell':'#ffebee' };
      const nivellOrdre = { 'Groc':1,'Taronja':2,'Vermell':3 };
      const diesNom = ['Dg','Dl','Dm','Dc','Dj','Dv','Ds'];
      const mesoNom = ['gen','feb','mar','abr','mai','jun','jul','ago','set','oct','nov','des'];

      const files = diesPagina.map(ts => {
        const rows = grups[ts] || [];
        const dt = new Date(ts);
        const dataFmt = `${diesNom[dt.getDay()]} ${dt.getDate()} ${mesoNom[dt.getMonth()]} ${dt.getFullYear()}`;
        const diaStr = ts.substring(0, 10);

        const zonesMax = {};
        for (const r of rows) {
          if (!zonesMax[r.zona] || (nivellOrdre[r.nivell]||0) > (nivellOrdre[zonesMax[r.zona]]||0))
            zonesMax[r.zona] = r.nivell;
        }
        const resum = Object.entries(zonesMax)
          .sort((a,b) => (nivellOrdre[b[1]]||0) - (nivellOrdre[a[1]]||0))
          .map(([zona, niv]) => `<span style="background:${nivellBg[niv]||'#eee'};color:${nivellColor[niv]||'#333'};padding:0.1rem 0.35rem;border-radius:3px;font-size:0.72rem;font-weight:600;">${zona}</span>`)
          .join(' ');
        const meteors = [...new Set(rows.map(r => r.meteor))].join(', ');
        const nivellMax = Object.values(zonesMax).sort((a,b)=>(nivellOrdre[b]||0)-(nivellOrdre[a]||0))[0]||'—';

        // SMP numèric (0-6): mateixa fórmula que calcularSMPPonderat
        const nivellOrdreH = { 'Groc':1, 'Taronja':2, 'Vermell':3 };
        const zonesNivellH = {};
        for (const r of rows) {
          const grup = riscParams.zonesGrup[r.zona] || r.zona;
          if (!((riscParams.zones[grup] ?? -1) > 0)) continue;
          if (!nivellOrdreH[r.nivell]) continue;
          if (!zonesNivellH[grup] || nivellOrdreH[r.nivell] > nivellOrdreH[zonesNivellH[grup]])
            zonesNivellH[grup] = r.nivell;
        }
        const nV = Object.values(zonesNivellH).filter(n => n === 'Vermell').length;
        const nT = Object.values(zonesNivellH).filter(n => n === 'Taronja').length;
        const nG = Object.values(zonesNivellH).filter(n => n === 'Groc').length;
        const smpNum = nV >= 3 ? 6 : nV > 0 ? 5 : nT >= 3 ? 4 : nT > 0 ? 3 : nG >= 3 ? 2 : nG > 0 ? 1 : 0;

        // Probabilitat màxima del dia
        const maxProb = rows.reduce((mx, r) => Math.max(mx, r.probabilitat || 0), 0);
        const probTxt = maxProb > 0 ? `<span style="color:#555;font-size:0.72rem;font-weight:400;"> · ${maxProb}%</span>` : '';

        // Files d'override per aquest dia
        const ovFiles = (overridePerDia[diaStr] || []).map(ov => {
          const hora = new Date(ov.data_hora).toLocaleTimeString('ca', { hour:'2-digit', minute:'2-digit' });
          return `<tr style="background:#fffbeb;border-bottom:1px solid #fde68a;">
            <td style="padding:0.2rem 0.5rem;color:#92400e;font-size:0.75rem;">✏️ ${hora}</td>
            <td style="padding:0.2rem 0.5rem;font-weight:700;color:#92400e;">${ov.valor_smp}</td>
            <td colspan="2" style="padding:0.2rem 0.5rem;color:#78350f;font-size:0.75rem;font-style:italic;">${escapeHtml(ov.motiu)}</td>
          </tr>`;
        }).join('');

        return `<tr style="border-bottom:1px solid #eee;">
          <td style="padding:0.3rem 0.5rem;white-space:nowrap;font-weight:600;">${dataFmt}</td>
          <td style="padding:0.3rem 0.5rem;white-space:nowrap;text-align:center;">
            <span style="font-weight:700;font-size:1rem;color:${nivellColor[nivellMax]||'#388e3c'};">${smpNum}</span>
            ${nivellMax !== '—' ? `<span style="display:block;font-size:0.65rem;font-weight:600;color:${nivellColor[nivellMax]||'#555'};">${nivellMax}</span>` : ''}
          </td>
          <td style="padding:0.3rem 0.5rem;text-align:center;color:#555;font-size:0.8rem;">${maxProb > 0 ? maxProb + '%' : '—'}</td>
          <td style="padding:0.3rem 0.5rem;line-height:1.8;">${resum}</td>
          <td style="padding:0.3rem 0.5rem;color:#666;font-size:0.75rem;">${meteors}</td>
        </tr>${ovFiles}`;
      }).join('');

      el.innerHTML = `
        <table style="width:100%;border-collapse:collapse;font-size:0.8rem;">
          <thead><tr style="background:#e3f2fd;">
            <th style="padding:0.3rem 0.5rem;text-align:left;">Dia</th>
            <th style="padding:0.3rem 0.5rem;text-align:center;">Risc</th>
            <th style="padding:0.3rem 0.5rem;text-align:center;">Prob.</th>
            <th style="padding:0.3rem 0.5rem;text-align:left;">Zones afectades</th>
            <th style="padding:0.3rem 0.5rem;text-align:left;">Fenòmens</th>
          </tr></thead>
          <tbody>${files}</tbody>
        </table>`;
    }

      smpHistoricMes = smpHistoricMesos[nouIdx];

    let simFiles = [];

    function simAfegirFila() {
      const id = simIdCounter++;

      const zonesOpts = Object.entries(riscParams.zones)
        .filter(([, v]) => v > 0)

        <select class="risc-form-input" style="font-size:0.78rem;padding:0.25rem;" onchange="simRecalcular()">${nivellsOpts}</select>
        <button class="risc-btn" style="padding:0.2rem 0.4rem;font-size:0.8rem;" onclick="simEliminarFila(${id})">✕</button>
      `;
      document.getElementById('sim-files').appendChild(fila);
      simRecalcular();
    }

    function simEliminarFila(id) {
      simFiles = simFiles.filter(f => f !== id);
      document.getElementById(`sim-fila-${id}`)?.remove();
      if (simFiles.length === 0) document.getElementById('sim-cap')?.remove();
      simRecalcular();
    }

    function simRecalcular() {
      const nivellOrdre = { 'Groc': 1, 'Taronja': 2, 'Vermell': 3 };
      const infoPerZona = {};
      document.querySelectorAll('[id^="sim-fila-"]').forEach(fila => {
        const selects = fila.querySelectorAll('select');
        if (selects.length < 2) return;
        const zona = selects[0].value;
        const nivell = selects[1].value;
        if (!infoPerZona[zona] || nivellOrdre[nivell] > nivellOrdre[infoPerZona[zona]]) {
          infoPerZona[zona] = nivell;
        }
      });

      const counts = { 'Groc': 0, 'Taronja': 0, 'Vermell': 0 };
      for (const n of Object.values(infoPerZona)) counts[n]++;
      const { Groc: g, Taronja: t, Vermell: v } = counts;

      let valor = 0, explicacio = 'Cap alerta';
      if      (v >= 3) { valor = 6; explicacio = `${v} zones vermell (≥3)`; }
      else if (v >  0) { valor = 5; explicacio = `${v} zona vermell (<3)`;  }
      else if (t >= 3) { valor = 4; explicacio = `${t} zones taronja (≥3)`; }
      else if (t >  0) { valor = 3; explicacio = `${t} zona taronja (<3)`;  }
      else if (g >= 3) { valor = 2; explicacio = `${g} zones groc (≥3)`;    }
      else if (g >  0) { valor = 1; explicacio = `${g} zona groc (<3)`;     }

      const res = document.getElementById('sim-resultat');
      if (!res) return;
      const color = valor >= 5 ? '#c62828' : valor >= 3 ? '#e65100' : valor >= 1 ? '#f57f17' : '#388e3c';
      res.innerHTML = `🟡 ${g} groc &nbsp;🟠 ${t} taronja &nbsp;🔴 ${v} vermell<br>
        <strong style="font-size:1.1rem;color:${color};">SMP = ${valor} / 6</strong>
        <span style="color:#666;font-size:0.75rem;margin-left:0.5rem;">${explicacio}</span>`;
    }

    function netejarErrors() {
      if (confirm('Segur que vols esborrar tots els errors guardats?')) {
        errorLog.length = 0;
        try { localStorage.removeItem(LS_ERRORS_KEY); } catch {}
        document.getElementById('errors-list').innerHTML = renderErrorLog();
        const badge = document.getElementById('badge-errors');
        if (badge) badge.style.display = 'none';
      }
    }

    function renderErrorLog() {
      if (errorLog.length === 0) return '<div style="color:#aaa;padding:0.5rem;">Cap error registrat.</div>';

      return errorLog.map(e => {
        const d = new Date(e.ts);
        const hora = d.toLocaleTimeString('ca', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
        const data = d.toLocaleDateString('ca');
        const color = '#c62828';
        return `<div style="border-left:3px solid ${color};padding:0.4rem 0.75rem;margin-bottom:0.4rem;background:#fff8f8;border-radius:0 4px 4px 0;">
          <div style="display:flex;justify-content:space-between;">
            <span style="font-weight:700;color:${color};">${e.font}</span>
            <span style="color:#aaa;font-size:0.75rem;">${data} ${hora}</span>
          </div>
          <div style="color:#333;margin-top:0.15rem;">${e.missatge}</div>
          ${e.detall ? `<div style="color:#888;font-size:0.75rem;margin-top:0.1rem;">${e.detall}</div>` : ''}
        </div>`;
      }).join('');
    }

    function obrirRiscConfig(day) {
      const dia = riscState[day];
      if (!dia) return;
      
      document.getElementById('risc-config-day').value = day;
      document.getElementById('risc-modal-day').textContent = day === 'today' ? 'Avui' : 'Demà';
      
      document.getElementById('risc-config-planspc').value = dia.planspc || 0;
      document.getElementById('risc-config-smp').value = dia.smp || 0;
      document.getElementById('risc-config-allaus').value = dia.allaus || 0;
      document.getElementById('risc-config-afluencia').value = dia.afluencia || 0;
      document.getElementById('risc-config-hc').value = dia.hc || 0;
      document.getElementById('risc-config-canvi').value = dia.canvi || 0;
      document.getElementById('risc-config-boletaires').value = dia.boletaires || 0;
      document.getElementById('risc-config-notes').value = dia.notes || '';
      document.getElementById('risc-config-motiu').value = '';
      
      document.getElementById('risc-modal').classList.add('active');
    }
    
    function tancarRiscModal() {
      document.getElementById('risc-modal').classList.remove('active');
    }
    
    function guardarRiscConfig() {
      const day = document.getElementById('risc-config-day').value;
      const dia = riscState[day];
      const motiu = document.getElementById('risc-config-motiu').value;
      
      const camps = ['planspc', 'smp', 'allaus', 'afluencia', 'hc', 'canvi', 'boletaires'];
      const labels = {
        planspc: 'Plans PC',
        smp: 'Alertes SMP',
        allaus: 'Risc allaus',
        afluencia: 'Afluència',
        hc: 'Dificultat HC',
        canvi: 'Canvi temps',
        boletaires: 'Boletaires'
      };
      
      camps.forEach(camp => {
        const nouValor = document.getElementById('risc-config-' + camp).value;
        if (dia[camp] != nouValor) {
          riscState.history.push({
            timestamp: new Date().toISOString(),
            dia: day === 'today' ? 'Avui' : 'Demà',
            camp: labels[camp],
            valorAnterior: dia[camp],
            valorNou: nouValor,
            motiu: motiu
          });
          dia[camp] = nouValor;
        }
      });
      
      dia.notes = document.getElementById('risc-config-notes').value;
      dia.modificat = new Date().toISOString();
      dia.modificatManualment = true;  // Marcar que s'ha editat manualment
      
      localStorage.setItem('riscGRAE', JSON.stringify(riscState));
      renderRisc();
      tancarRiscModal();
    }
    
    function exportarRiscJSON() {
      const dataStr = JSON.stringify(riscState, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'risc-grae-' + getRiscDateString() + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }

        localStorage.setItem('riscGRAE', JSON.stringify(riscState));
        renderRisc();
      }

    async function enviarRiscSupabase(dataStr, edicions) {
      const data = dataStr || getRiscDateString(0);
      const dia = dataStr ? null : riscState.today;
      const risc = dia ? calcularRisc(dia) : null;

      const resultatEl = document.getElementById('enviar-resultat');
      if (resultatEl) {
        resultatEl.style.display = 'block';
        resultatEl.innerHTML = '<span style="color:#666;">Guardant a Supabase...</span>';
      }

      if (!dia) {
        if (resultatEl) resultatEl.innerHTML = '<span style="color:#e53935;">⚠️ No hi ha dades del dia</span>';
        return;
      }

      const factors = {
        planspc: Math.round(dia.planspc || 0),
        smp: Math.round(dia.smp || 0),
        allaus: Math.round(dia.allaus || 0),
        afluencia: Math.round(dia.afluencia || 0),
        hc: Math.round(dia.hc || 0),
        canvi: Math.round(dia.canvi || 0),
        boletaires: Math.round(dia.boletaires || 0)
      };

      const res = await guardarRiscSupabase(data, risc, factors, dia.notes);
      if (resultatEl) {
        resultatEl.innerHTML = res.ok
          ? '<span style="color:#2e7d32;">✅ Guardat a Supabase</span>'
          : '<span style="color:#e53935;">❌ Error: ' + (res.error || 'desconegut') + '</span>';
      }
    }

    async function enviarEdicionsManuals() {
      const edicions = riscState.history || [];
      const avui = getRiscDateString(0);
      const edicionsAvui = edicions.filter(e => e.timestamp && e.timestamp.startsWith(avui));
      await enviarRiscSupabase(avui, edicionsAvui);
    }

    async function carregarDiaHistoric() {

      const res = document.getElementById('historic-resultat');

      try {
        const dades = await carregarDiaSupabase(input);

        if (!dades) {
          res.innerHTML = '<span style="color:#e53935;">No hi ha dades per aquesta data</span>';
          return;

        const colors = { 0:'#4caf50',1:'#8bc34a',2:'#cddc39',3:'#ff9800',4:'#ff5722',5:'#f44336',6:'#b71c1c' };

        const FACTOR_MAX = {planspc:3,smp:6,allaus:5,afluencia:3,hc:2,canvi:2,boletaires:2};

        const filesFactors = Object.entries(FACTOR_LABELS).map(([k, label]) =>
          '<tr style="border-bottom:1px solid #eee;">' +
          '<td style="padding:0.3rem;">' + label + '</td>' +

        res.innerHTML = '<div style="background:#f9f9f9;border:1px solid #ddd;border-radius:6px;padding:1rem;">' +
          '<div style="display:flex;align-items:center;gap:1rem;margin-bottom:0.75rem;">' +
          '<span style="font-size:2rem;font-weight:700;color:' + color + '">' + dades.risc + '</span>' +
          '<div><div style="font-weight:600;">' + input + '</div>' +
          '<div style="font-size:0.75rem;color:#888;">Risc GRAE · font: ' + (dades.font||'—') + ' · ' + new Date(dades.creat_at).toLocaleString('ca-ES') + '</div></div></div>' +
          '<table style="width:100%;font-size:0.8rem;border-collapse:collapse;">' +
          '<tr style="background:#f0f0f0;"><th style="padding:0.3rem;text-align:left;">Factor</th><th style="padding:0.3rem;text-align:center;">Valor</th><th style="padding:0.3rem;text-align:right;">Màx</th></tr>' +
          filesFactors + '</table>' +
          (dades.notes ? '<div style="margin-top:0.5rem;font-size:0.8rem;color:#666;">📝 ' + escapeHtml(dades.notes) + '</div>' : '') +
          '</div>';
      } catch (e) {
        res.innerHTML = '<span style="color:#e53935;">❌ ' + e.message + '</span>';
      }

    function getAvuiStr() {
      const d = new Date();

    }

    async function geocodificar(lloc) {
      // Nominatim OpenStreetMap geocoding - afegim "Catalunya" per millorar resultats
      const q = encodeURIComponent(lloc + ', Catalunya');
      try {
        const resp = await fetch('https://nominatim.openstreetmap.org/search?q=' + q + '&format=json&limit=1&countrycodes=es', {
          headers: { 'Accept-Language': 'ca' }
        });
        const data = await resp.json();
        if (data && data.length > 0) {
          return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        }
      } catch(e) {}
      return null;
    }

    async function carregarHelicoptersDiaSupabase(dataStr) {
      try {
        const { data, error } = await sbClient
          .from('helicopters_historic')
          .select('*')
          .eq('data', dataStr)
          .order('heli_id');
        if (error || !data || data.length === 0) return null;
        return data.map(row => ({
          id: row.heli_id,
          recurs: row.recurs,
          base: row.base,
          lat: row.lat,
          lon: row.lon,
          operativitat: row.operativitat,
          observacions: row.observacions
        }));
      } catch(e) {
        return null;
      }
    }

    async function carregarDadesHelicoptersDia(dataStr) {
      heliEl('status').textContent = 'Carregant...';

      // Supabase primer
      const dadesSupabase = await carregarHelicoptersDiaSupabase(dataStr);
      if (dadesSupabase) {
        helicopterDadesActuals = dadesSupabase;
        renderTaulaHelicopters();
        heliEl('status').textContent = '✅ ' + dataStr;
        return;
      }

      helicopterDadesActuals = JSON.parse(JSON.stringify(HELICOPTERS_BASE));
      renderTaulaHelicopters();
      heliEl('status').textContent = 'Per defecte';
    }
