name: Sincronitzar el web de proves

# GitHub Pages publica la branca `main` tal com està, així que el banc de proves
# és la carpeta `proves/` dins de `main`. Aquest workflow hi copia l'app a cada
# canvi d'index.html o mapa.html.
#
# Abans copiava des de la branca `proves` i només s'activava amb pushes a
# `proves`. Aquella branca es va abandonar el 27-08-2026 i des d'aleshores el
# workflow no s'ha executat mai: /proves/ es va quedar amb una còpia de fa
# setmanes i semblava que els canvis publicats no arribessin.
#
# Només es copien index.html i mapa.html. Els GeoJSON i les dades (data/) no es
# dupliquen: index.html llegeix els JSON per URL absoluta i mapa.html busca els
# GeoJSON a l'arrel quan detecta que corre sota /proves/.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'mapa.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronitzar-proves
  cancel-in-progress: false

jobs:
  sincronitzar:
    runs-on: ubuntu-latest

    steps:
      - name: Branca main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Copiar l'app a proves/
        run: |
          mkdir -p proves
          cp index.html proves/index.html
          cp mapa.html  proves/mapa.html

      - name: Commit a main si hi ha canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proves/
          git diff --staged --quiet && echo "El web de proves ja estava al dia" || \
            (git commit -m "chore: sincronitzar el web de proves ($(date -u '+%Y-%m-%d %H:%M UTC'))" && git push)
