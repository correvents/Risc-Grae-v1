name: Risc diari GRAE

on:
  schedule:
    # Ancoratge, no hora d'execució: el retard de GitHub va de 2 h a 7 h. Amb
    # l'anterior (21:00 UTC) un retard de 7 h el deixava a les 04:00 UTC, que
    # són les 06:00 de Madrid: just el llindar d'`HORA_INICI_DIA` de
    # `diaDeTancament()`, o sigui que hauria tancat el dia equivocat. Des de les
    # 18:43 UTC, el pitjor cas cau a les 03:43 de Madrid i el dia encara és el bo.
    - cron: '43 18 * * *'  # ~21:00-01:00 local un cop endarrerit
  workflow_dispatch:

jobs:
  risc:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Calcular i guardar risc
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/risc-diari.js
