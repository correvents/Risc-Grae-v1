name: Dades diàries GRAE

on:
  schedule:
    # ATENCIÓ: aquestes hores són ANCORATGES, no hores d'execució. GitHub
    # endarrereix els crons de manera irregular i el retard aquí mesurat va de
    # 2 h 14 min a 6 h 53 min (11-14 de setembre del 2026), i creixent. Amb els
    # crons antics (05:45 UTC el primer) la primera passada del dia queia entre
    # les 09:36 i les 11:00 UTC: cada matí, fins al migdia, la web ensenyava les
    # dades del vespre anterior. Per això el primer ancoratge és de matinada:
    # no és que es vulgui consultar a les 00:23, és que amb el retard arriba a
    # primera hora del matí.
    #
    # Els minuts són senars i lluny del :00 a posta: els crons a l'hora en punt
    # són els més congestionats i els que més s'endarrereixen.
    #
    # L'últim ancoratge no pot passar de les 14:00 UTC: amb 7 h de retard
    # arribaria a les 21:00 UTC (23 h a Madrid) i, si travessés la mitjanit,
    # `fetch-canvi-temps.js` (que fa servir `avuiMadrid()`) escriuria la fila
    # del dia equivocat.
    - cron: '23 0 * * *'   # ~05:00-09:00 local un cop endarrerit (força guardat)
    - cron: '37 3 * * *'   # ~08:00-12:00 local (guarda si canvis)
    - cron: '47 6 * * *'   # ~11:00-15:00 local (guarda si canvis)
    - cron: '53 9 * * *'   # ~14:00-18:00 local (guarda si canvis)
    - cron: '43 12 * * *'  # ~17:00-21:00 local (guarda si canvis)
    - cron: '17 14 * * *'  # ~19:00-23:00 local (guarda si canvis)
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar guardat (ignorar canvis)'
        type: boolean
        default: false

jobs:
  actualitzar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determinar force
        id: cfg
        run: |
          FORCE=false
          # La cadena ha de coincidir EXACTAMENT amb el primer cron de dalt: si
          # es canvia l'ancoratge i no es canvia aquí, el guardat forçat diari
          # deixa de fer-se i no ho diu ningú.
          [[ "${{ github.event.schedule }}" == "23 0 * * *" ]] && FORCE=true
          [[ "${{ github.event.inputs.force }}" == "true" ]] && FORCE=true
          echo "force=$FORCE" >> $GITHUB_OUTPUT

      - name: SMP
        continue-on-error: true
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-smp.js

      - name: Previsió
        continue-on-error: true
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-previsio.js

      - name: Plans PC
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-planspc.js

      - name: BPA
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-bpa.js

      - name: Canvi Temps
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-canvi-temps.js

      # Aquí el `git push` anava pelat, sense cap reintent: si la captura del
      # risc havia empès mentrestant, el push rebotava i el pas queia. És la
      # mateixa cursa que va petar a `captura-risc.yml` el 15-09-2026, vista
      # des de l'altre costat. Vegeu `scripts/commit-dades.sh`.
      - name: Commit JSON
        run: bash scripts/commit-dades.sh
