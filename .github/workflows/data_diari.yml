name: Dades diàries GRAE

# QUI MANA LES HORES: Supabase, no aquest fitxer.
#
# Les passades les dispara `pg_cron` amb `workflow_dispatch` (jobs `ingesta-*`,
# estiu i hivern), ancorades uns minuts abans de les hores en què hem promès que
# la web tindrà les dades: **06:50, 10:50, 14:50 i 20:30 de Madrid**. Arriben al
# segon i publiquen en menys de mig minut.
#
# Un cron de GitHub no pot fer això: el retard mesurat va de 2 h 14 min a 6 h
# 53 min (vegeu la trampa 8 del CLAUDE.md). N'hi havia sis, i des que hi ha els
# dispatches feien la mateixa feina a hores aleatòries: deu passades al dia on
# en calien quatre. S'han tret.
#
# En queda **un de sol, com a xarxa de seguretat**: si el `pg_cron` caigués
# (projecte pausat, secret del Vault caducat, `pg_net` trencat), aquest garanteix
# una passada al dia i la diferència es veu de seguida a Actions. També és el
# que força el guardat diari — vegeu el pas «Determinar force», que compara la
# cadena del cron: si canvies l'hora aquí, canvia-la també allà.
on:
  schedule:
    - cron: '23 0 * * *'   # reserva diària (~05:00-09:00 de Madrid un cop endarrerit)
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar guardat (ignorar canvis)'
        type: boolean
        default: false

jobs:
  actualitzar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determinar force
        id: cfg
        run: |
          FORCE=false
          # La cadena ha de coincidir EXACTAMENT amb el primer cron de dalt: si
          # es canvia l'ancoratge i no es canvia aquí, el guardat forçat diari
          # deixa de fer-se i no ho diu ningú.
          [[ "${{ github.event.schedule }}" == "23 0 * * *" ]] && FORCE=true
          [[ "${{ github.event.inputs.force }}" == "true" ]] && FORCE=true
          echo "force=$FORCE" >> $GITHUB_OUTPUT

      - name: SMP
        id: smp
        continue-on-error: true
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-smp.js

      - name: Previsió
        id: previsio
        continue-on-error: true
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-previsio.js

      - name: Plans PC
        id: planspc
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-planspc.js

      - name: BPA
        id: bpa
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-bpa.js

      - name: Canvi Temps
        id: canvi
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-canvi-temps.js

      # Aquí el `git push` anava pelat, sense cap reintent: si la captura del
      # risc havia empès mentrestant, el push rebotava i el pas queia. És la
      # mateixa cursa que va petar a `captura-risc.yml` el 15-09-2026, vista
      # des de l'altre costat. Vegeu `scripts/commit-dades.sh`.
      - name: Commit JSON
        run: bash scripts/commit-dades.sh

      # El `continue-on-error` de cada baixada hi és a posta: si una font cau,
      # les altres quatre han d'arribar i commitejar-se igualment. Però també
      # deixava el job **en verd**, i llavors una font caiguda no la veia ningú
      # —ni a Actions, ni enlloc— fins que algú es mirava les dades de prop.
      # Aquest pas tanca la passada en vermell i diu quines han fallat, després
      # d'haver desat el que sí que ha arribat.
      - name: Comprovar que totes les fonts han baixat
        if: always()
        run: |
          ko=""
          [ "${{ steps.smp.outcome }}"      = "failure" ] && ko="$ko SMP"
          [ "${{ steps.previsio.outcome }}" = "failure" ] && ko="$ko Previsió"
          [ "${{ steps.planspc.outcome }}"  = "failure" ] && ko="$ko Plans-PC"
          [ "${{ steps.bpa.outcome }}"      = "failure" ] && ko="$ko BPA"
          [ "${{ steps.canvi.outcome }}"    = "failure" ] && ko="$ko Canvi-temps"
          if [ -n "$ko" ]; then
            echo "❌ Fonts que no han baixat en aquesta passada:$ko"
            echo "   La resta s'ha desat igualment; aquestes es queden amb les dades d'abans."
            exit 1
          fi
          echo "✅ Les cinc fonts han baixat."
