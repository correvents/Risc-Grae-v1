name: Dades diàries GRAE

on:
  schedule:
    # GitHub endarrereix els crons de manera irregular (s'ha vist +3 h), o sigui
    # que amb tres passades al dia hi podia haver forats de 6-8 h: un avís de
    # tempesta que Meteocat obre al matí no arribava a la web fins al migdia.
    - cron: '45 5 * * *'   # 06:45 CET hivern (força guardat)
    - cron: '0 8 * * *'    # 09:00 CET hivern (guarda si canvis)
    - cron: '0 10 * * *'   # 12:00 CET hivern (guarda si canvis)
    - cron: '30 13 * * *'  # 14:30 CET hivern (guarda si canvis)
    - cron: '0 16 * * *'   # 18:00 CET hivern (guarda si canvis)
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar guardat (ignorar canvis)'
        type: boolean
        default: false

jobs:
  actualitzar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determinar force
        id: cfg
        run: |
          FORCE=false
          [[ "${{ github.event.schedule }}" == "45 5 * * *" ]] && FORCE=true
          [[ "${{ github.event.inputs.force }}" == "true" ]] && FORCE=true
          echo "force=$FORCE" >> $GITHUB_OUTPUT

      - name: SMP
        continue-on-error: true
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-smp.js

      - name: Previsió
        continue-on-error: true
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-previsio.js

      - name: Plans PC
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-planspc.js

      - name: BPA
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-bpa.js

      - name: Canvi Temps
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ steps.cfg.outputs.force }}
        run: node scripts/fetch-canvi-temps.js

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "Sense canvis als JSON" || \
            (git commit -m "chore: dades $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)
