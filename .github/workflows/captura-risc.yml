name: Captura del risc

# Quatre captures al dia del risc d'avui i de demà, amb tot el desglossament, a
# `risc_captures`. Serveix per veure **com evoluciona** el risc al llarg del dia:
# `risc_historic` només en guarda l'última foto, perquè té UNIQUE (data).
#
# LES HORES NO LES MANA AQUEST FITXER. El cron de GitHub arriba de 2 a 7 hores
# tard (vegeu la trampa 8 del CLAUDE.md), i una captura «de les 10:50» que cau a
# les 15:00 no serveix per comparar dies. Qui les dispara a l'hora és Supabase
# (`pg_cron` + `pg_net` cridant `workflow_dispatch`), que sí que és puntual:
# vegeu PLA-CAPTURES.md §4 per al SQL.
#
# N'hi havia tres de reserva, un per franja. Feien la mateixa feina que els
# dispatches però a hores aleatòries: sis passades al dia on en calien tres, i
# cadascuna podia cremar mitja hora de reintents i sis consultes a Meteocat.
# En queda **un de sol**: si el `pg_cron` caigués, garanteix una captura al dia
# —degradada, però viva— i que només n'hi hagi una es veu de seguida. La franja
# la decideix l'hora real d'execució (`diaIFranja()`), no el cron.

on:
  workflow_dispatch:
    inputs:
      franja:
        description: 'Franja de la captura (matinada, mati, migdia, vespre, extra). Buit = per l''hora que és.'
        type: string
        default: ''
  schedule:
    - cron: '47 6 * * *'    # reserva diària (~09:00-13:40 UTC un cop endarrerit)

concurrency:
  group: captura-risc
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Baixar dades i capturar (amb reintent si Meteocat no ha actualitzat)
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          FRANJA: ${{ github.event.inputs.franja }}
        run: |
          # Meteocat publica a hores fixes, però no sempre puntual. Si el butlletí
          # és idèntic al de l'última captura, captura-risc.js surt amb 75: vol dir
          # "encara no hi ha res nou". S'espera 5 minuts i s'hi torna, fins a 6
          # vegades (mitja hora). Després es captura igualment, dient-ho: una
          # captura que diu "aquí no hi havia res nou" val; una que no existeix, no.
          fet=no
          for i in $(seq 1 6); do
            # Una font caiguda no ha d'impedir capturar la resta, però **s'ha de
            # saber quina ha caigut**. Amb el `|| true` que hi havia, l'error es
            # descartava i `captura-risc.js` llegia el JSON vell del disc i el
            # desava com si fos d'ara — i `hi_es` no ho delatava, perquè el
            # fitxer sempre hi és. Ara els noms van a FONTS_KO i la captura ho
            # diu i es marca com a incompleta.
            FONTS_KO=""
            node scripts/fetch-smp.js         || FONTS_KO="$FONTS_KO,smp"
            node scripts/fetch-bpa.js         || FONTS_KO="$FONTS_KO,bpa"
            node scripts/fetch-planspc.js     || FONTS_KO="$FONTS_KO,planspc"
            node scripts/fetch-canvi-temps.js || FONTS_KO="$FONTS_KO,canvi"
            export FONTS_KO

            # Compte amb l'estat de sortida: `codi=$?` després d'un `if` recull el
            # de l'`if` (que és 0 quan la condició falla i no hi ha `else`), no el
            # del node. Amb aquell error, una captura que fallava sortia com a
            # èxit i ningú se n'assabentava. Es recull abans de res.
            set +e
            node scripts/captura-risc.js
            codi=$?
            set -e
            if [ "$codi" -eq 0 ]; then
              fet=si
              break
            fi
            if [ "$codi" -ne 75 ]; then
              echo "❌ La captura ha fallat amb el codi $codi."
              exit "$codi"
            fi
            echo "⏳ Meteocat encara no ha actualitzat ($i/6). Espero 5 minuts."
            sleep 300
          done

          if [ "$fet" = "no" ]; then
            echo "⚠️ Mitja hora sense butlletí nou: capturo igualment i ho deixo dit."
            FORCA_CAPTURA=true node scripts/captura-risc.js
          fi

      # El rebase que hi havia aquí no servia: els JSON són instantànies
      # regenerables i un rebase els dona per fusionables. El 15-09-2026 la
      # captura del vespre va xocar amb la passada de dades i va morir amb
      # CONFLICT als quatre fitxers alhora. Vegeu `scripts/commit-dades.sh`.
      - name: Commit JSON
        run: bash scripts/commit-dades.sh
